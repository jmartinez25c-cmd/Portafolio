    '¡Excelente defensa! Chiste: ¿Cuál es la contraseña de un pez? ¡Nad@123! 🐟',
    '¡Tu cortafuegos está en forma! Chiste: ¿Por qué el servidor estaba tranquilo? Porque tenía buena conexión. 😄'
  ];
  const FACTS = [
    'Dato curioso: el nombre de la ciudad Cloudsdale combina “cloud” (nube) y “dale” (valle).',
    'Dato curioso: Spike es el asistente de Twilight y también un mensajero muy particular.',
    'Dato curioso: la Cutie Mark de Rarity está formada por tres diamantes azules.',
    'Dato curioso: Pinkie Pie trabaja en Sugarcube Corner, la pastelería de Ponyville.'
  ];
  const SCROLL_CATALOG = [
    ['El mapa de Ponyville','🗺️'],['La amistad es mágica','💜'],['El secreto de la biblioteca','📚'],['La receta de Sugarcube Corner','🧁'],
    ['Los cielos de Cloudsdale','☁️'],['El diamante de Rarity','💎'],['La cosecha de Sweet Apple Acres','🍎'],['El refugio de los animales','🦋'],
    ['La fiesta sorpresa','🎈'],['El fuego de Spike','🔥'],['La magia de la armonía','✨'],['La leyenda de Equestria','🏰']
  ];
  function updateGameHud() {
    $('game-hud').innerHTML = `⭐ Puntos: ${gameScore} <small>Meta: 15 puntos para recuperar la información</small>`;
    $('game-hud').style.display = gameActive ? 'block':'none';
    const nav=$('game-score-nav'); if(nav) nav.textContent='⭐ '+gameScore+' puntos';
  }
  function renderScrollBook() {
    const unlocked=Math.min(SCROLL_CATALOG.length,collectedScrolls.length);
    $('scroll-progress').textContent=`${unlocked} de ${SCROLL_CATALOG.length} pergaminos desbloqueados`;
    $('scroll-grid').innerHTML=SCROLL_CATALOG.map((item,i)=> i<unlocked
      ? `<article class="scroll-entry"><span class="scroll-symbol">${item[1]}</span><strong>${esc(item[0])}</strong><small>✓ Coleccionado</small></article>`
      : `<article class="scroll-entry locked"><span class="scroll-symbol">🔒</span><strong>${esc(item[0])}</strong><small>Bloqueado</small></article>`).join('');
  }
  function openScrollCollection(){ renderScrollBook(); $('scroll-modal').classList.add('open'); }
  function closeScrollCollection(){ $('scroll-modal').classList.remove('open'); }
  renderScrollBook(); updateGameHud();
  function showGameMessage(msg, ms=4200) { const el=$('game-message'); el.textContent=msg; el.style.display='block'; clearTimeout(showGameMessage.t); showGameMessage.t=setTimeout(()=>el.style.display='none',ms); }
  function addGameScore(value) {
    const before=gameScore; gameScore=Math.max(0,gameScore+value); gameRoundScore=Math.max(0,gameRoundScore+value); lsSet('equestriaGameScore',gameScore); updateGameHud();
    while (gameScore>=gameNext15) { const reward=LORE_REWARDS[Math.floor(Math.random()*LORE_REWARDS.length)]; loreForNextQuestion=reward[1]; showGameMessage('🎉 ¡Has ganado un trozo de información valiosa! '+reward[0],6000); gameNext15+=15; }
    while (gameScore>=gameNext50) { const card='Pergamino #'+gameNext50+' — '+FACTS[Math.floor(Math.random()*FACTS.length)]; if(!collectedScrolls.includes(card)) collectedScrolls.push(card); lsSet('equestriaScrolls',collectedScrolls); renderScrollBook(); showGameMessage(FUN_MESSAGES[Math.floor(Math.random()*FUN_MESSAGES.length)]+' '+FACTS[Math.floor(Math.random()*FACTS.length)]+' 📜 Nuevo pergamino añadido a tu colección.',7500); gameNext50+=50; }
  }
  function startCollectionGame() {
    const overlay=$('sabotage-overlay');
    closeScrollCollection(); gameActive=true; gameItemsLeft=0; gameRoundScore=0; waitingForClickToRestore=true;
    $('speech-bubble').style.display='none'; document.body.classList.add('collecting-game'); updateGameHud();
    const pool=GAME_OBJECTS[currentPony]||GAME_OBJECTS.twilight;
    const count=currentPony==='fluttershy'?82:76;
    for(let i=0;i<count;i++){ const item=pool[Math.floor(Math.random()*pool.length)]; const el=addToOverlay('game-item',item[0],{left:rand(2,96)+'%',top:rand(10,90)+'%',fontSize:rand(1.45,2.25)+'rem',animationDelay:rand(0,2)+'s'}); el.dataset.value=item[1]; el.dataset.got='0'; gameItemsLeft++;
      let fleeTimer; const flee=()=>{ clearTimeout(fleeTimer); fleeTimer=setTimeout(()=>{ if(!gameActive||el.dataset.got==='1')return; el.style.left=rand(2,96)+'%'; el.style.top=rand(10,90)+'%'; el.style.transform='translate(0,0) scale(1.18)'; },140); }; el.addEventListener('pointerenter',flee); el.addEventListener('pointerleave',()=>clearTimeout(fleeTimer)); el.addEventListener('click',e=>{e.stopPropagation(); clearTimeout(fleeTimer); if(!gameActive||el.dataset.got==='1')return; el.dataset.got='1'; const val=Number(el.dataset.value)||1; addGameScore(val); el.style.transform='scale(0)'; el.style.opacity='0'; el.style.pointerEvents='none'; gameItemsLeft--; if(gameRoundScore >= (recoveryMode ? 10 : 15)){ finishCollectionGame(); } else if(gameItemsLeft===0){ showGameMessage('¡Se han acabado los objetos! Aparecerá otra tanda.'); later(startCollectionGame,1800); } });
    }
  }
  function finishCollectionGame() { if(!gameActive)return; gameActive=false; waitingForClickToRestore=false; recoveryMode=false; updateGameHud(); $('speech-bubble').innerText='¡Lo has conseguido! La información está a salvo. ✨'; restoreInformation(); }

  async function restoreInformation() {
    if (gameActive) return;
    clearTimeout(restoreTimeout); waitingForClickToRestore = false;
    const bubble=$('speech-bubble'), overlay=$('sabotage-overlay'), main=$('portfolio-container');
    document.body.classList.remove('collecting-game');
    bubble.innerText='¡Información recuperada! Volviendo a su lugar poco a poco… ✨';
    // Retira los efectos y deja que el contenido vuelva con una transición gradual.
    if(currentPony==='spike'){ const bg=overlay.querySelector('.spike-fire-bg'); if(bg)bg.style.opacity=0; }
    if(currentPony==='rarity'){ const f=overlay.querySelector('.fabric'); if(f)f.classList.remove('in'); }
    main.classList.remove('aura','poof','blown','dropped','party','shake');
    main.style.cssText=''; main.style.opacity='0'; main.style.transform=''; main.style.filter=''; main.style.animation='none';
    overlay.querySelectorAll('.game-item, .invading-animal, .balloon, .confetti, .streamer, .spark, .smoke, .apple, .dust, .flame, .water, .scroll, #extinguisher, .fabric, .party-banner, .rb-ring').forEach(el=>{el.style.transition='opacity .8s ease, transform .8s ease';el.style.opacity='0';el.style.transform+=' scale(.65)';});
    await sleepMs(250);
    main.classList.add('reveal-gradual'); main.style.opacity='';
    await sleepMs(2300);
    main.classList.remove('reveal-gradual'); main.style.animation='';
    resetSabotage(); bubble.style.display='none';
  }

  // --- RARITY: maniquí + vestidos ---
  const DRESSES = [
    { name: "Gala de Cristal", mat: "Seda lunar, zafiros incrustados e hilo de plata", use: "Ideal para una gran gala de gala.",
      body: "#3b82f6", skirt: "#60a5fa", trim: "#e0f2fe", gem: "#fde047", style: "gala" },
    { name: "Armadura Chic de Ciberseguridad", mat: "Terciopelo púrpura, diamantes y fibra óptica", use: "Perfecto para auditar servidores con estilo.",
      body: "#6b21a8", skirt: "#7e22ce", trim: "#22d3ee", gem: "#22d3ee", style: "cyber" },
    { name: "Vestido Primaveral", mat: "Organza pastel, perlas y encaje francés", use: "Para una tarde de té en la boutique.",
      body: "#f9a8d4", skirt: "#fbcfe8", trim: "#ffffff", gem: "#fef3c7", style: "spring" }
  ];

  function mannequinSVG(d) {
    let extra = "";
    if (d.style === "gala") {
      extra = `<path d="M70 215 Q100 232 130 215" stroke="${d.trim}" stroke-width="4" fill="none"/>
               ${[60, 85, 100, 115, 140].map((x, i) => `<circle cx="${x}" cy="${240 - (i % 2) * 10}" r="4" fill="${d.gem}"/>`).join('')}
               <rect x="82" y="118" width="36" height="8" fill="${d.trim}"/><circle cx="100" cy="122" r="5" fill="${d.gem}"/>`;
    } else if (d.style === "cyber") {
      extra = `<g stroke="${d.trim}" stroke-width="2" fill="none">
                 <path d="M60 235 H80 V205 H100 V235 H120 V215 H140"/><path d="M75 180 H95 V160 H125"/>
                 <path d="M90 100 V118 H110"/></g>
               ${[[80, 205], [120, 235], [125, 160], [110, 118]].map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${d.gem}"/>`).join('')}`;
    } else {
      extra = `<path d="M40 255 q10 12 20 0 q10 12 20 0 q10 12 20 0 q10 12 20 0 q10 12 20 0 q10 12 20 0" fill="${d.trim}"/>
               <path d="M100 124 l-18 -12 v24 z M100 124 l18 -12 v24 z" fill="#ec4899"/><circle cx="100" cy="124" r="5" fill="#be185d"/>
               ${[70, 95, 125, 150].map((x, i) => `<circle cx="${x}" cy="${215 + i * 5}" r="3.5" fill="${d.gem}" stroke="#d1d5db"/>`).join('')}`;
    }
    return `<svg viewBox="0 0 200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vestido ${d.name} sobre un maniquí">
      <ellipse cx="100" cy="303" rx="52" ry="9" fill="#4b5563"/>
      <ellipse cx="100" cy="299" rx="44" ry="7" fill="#9ca3af"/>
      <rect x="96" y="262" width="8" height="38" fill="#6b7280"/>
      <rect x="93" y="34" width="14" height="22" rx="4" fill="#d6c7a8"/>
      <ellipse cx="100" cy="34" rx="9" ry="5" fill="#b8a888"/>
      <path d="M78 66 Q100 54 122 66 L126 78 Q133 112 120 128 Q126 150 123 168 L77 168 Q74 150 80 128 Q67 112 74 78 Z" fill="#e7dcc3" stroke="#b8a888" stroke-width="2"/>
      <path d="M78 66 Q100 54 122 66 L126 78 Q133 108 118 128 L82 128 Q67 108 74 78 Z" fill="${d.body}"/>
      <path d="M82 124 Q55 190 36 262 Q100 284 164 262 Q145 190 118 124 Z" fill="${d.skirt}"/>
      <path d="M82 124 H118" stroke="${d.trim}" stroke-width="5"/>
      <path d="M36 262 Q100 284 164 262" stroke="${d.trim}" stroke-width="5" fill="none"/>
      ${extra}
      <path d="M80 70 Q100 58 120 70" stroke="${d.trim}" stroke-width="4" fill="none"/>
    </svg>`;
  }

  // --- MÚSICA: lista guardada, subir/quitar canciones, aleatorio y repetir ---
  const DEFAULT_PLAYLIST = [
    { id: 'd1', name: "Tema Mágico de Equestria (Intro)", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
    { id: 'd2', name: "Noche en Canterlot (Cyber Mix)", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" }
  ];
  let playlist = DEFAULT_PLAYLIST.map(s => ({ ...s, src: s.url, kind: 'url' }));
  let currentSongIdx = 0, playHistory = [], shuffleBag = [];
  let shuffleOn = !!lsGet('mlp_shuffle', false), repeatMode = lsGet('mlp_repeat', 'all');   // all | one | off
  let includeMusic = !!lsGet('mlp_incmusic', false);
  const audioEl = $('audio-engine');
  Object.assign(IDB, { async del(k) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); } });
  const playable = () => playlist.map((s, i) => s.missing ? -1 : i).filter(i => i >= 0);
  const fmtTime = s => isFinite(s) ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '0:00';

  async function loadPlaylist() {      // lee la lista guardada (y los archivos subidos, que viven en IndexedDB)
    const list = site && Array.isArray(site.playlist) ? site.playlist : DEFAULT_PLAYLIST, out = [];
    for (const s of list) {
      const it = { id: s.id || uid(), name: s.name || 'Canción' };
      if (s.local) {
        it.kind = 'local';
        try { const blob = await IDB.get('song:' + it.id); if (blob) { it.blob = blob; it.src = URL.createObjectURL(blob); } } catch (e) {}
        if (!it.src) it.missing = true;
      } else if (s.data) { it.kind = 'embedded'; it.data = s.data; it.src = s.data; }
      else { it.kind = 'url'; it.url = s.url; it.src = s.url; }
      out.push(it);
    }
    audioEl.pause(); audioEl.removeAttribute('src'); $('play-pause-btn').innerText = '▶️'; $('current-song-name').innerText = 'Sin reproducción';
    playlist = out; currentSongIdx = Math.max(0, playable()[0] || 0); playHistory = []; shuffleBag = [];
    renderPlaylist();
  }
  function savePlaylist() {
    if (!site) return;
    site.playlist = playlist.map(s => s.kind === 'local' ? { id: s.id, name: s.name, local: true } : s.kind === 'embedded' ? { id: s.id, name: s.name, data: s.data } : { id: s.id, name: s.name, url: s.url });
    touch();
  }

  function renderPlaylist() {
    const box = $('playlist'); box.innerHTML = '';
    if (!playlist.length) box.append(h('div', { class: 'hint', style: 'padding:6px' }, isAdminMode ? 'La lista está vacía. Sube música o pega una URL.' : 'No hay música en la lista.'));
    playlist.forEach((s, i) => {
      const row = h('div', { class: 'song-item' + (i === currentSongIdx ? ' playing' : '') + (s.missing ? ' missing' : ''), title: s.missing ? 'Este archivo ya no está disponible en este navegador' : s.name },
        h('span', { class: 'nm' }, '🎵 ' + s.name));
      if (!s.missing) row.addEventListener('click', () => playSong(i));
      if (isAdminMode) {
        row.append(h('button', { class: 'mini', title: 'Cambiar el nombre', onclick: e => { e.stopPropagation(); renameSong(i, row); } }, '✏️'),
          confirmBtn('mini', '✕', 'Quitar de la lista', () => removeSong(i)));
      }
      box.append(row);
    });
  }

  function renameSong(i, row) {        // edita el nombre en la propia lista (Enter guarda, Esc cancela)
    const s = playlist[i], nm = row.querySelector('.nm');
    const inp = h('input', { type: 'text', value: s.name, maxlength: 80, style: 'flex:1; min-width:0; padding:3px 6px; border-radius:5px; border:1px solid var(--secondary); background:var(--bg-color); color:var(--text-color); font-size:.8rem' });
    let done = false;
    const finish = ok => {
      if (done) return; done = true;
      const v = inp.value.trim();
      if (ok && v && v !== s.name) { s.name = v; savePlaylist(); if (i === currentSongIdx && audioEl.getAttribute('src')) $('current-song-name').innerText = v; }
      renderPlaylist();
    };
    inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') finish(true); else if (e.key === 'Escape') finish(false); });
    inp.addEventListener('blur', () => finish(true));
    inp.addEventListener('click', e => e.stopPropagation());
    nm.replaceWith(inp); inp.focus(); inp.select();
  }
  function playSong(i, fromHistory) {
    const s = playlist[i]; if (!s || s.missing) return;
    if (!fromHistory && i !== currentSongIdx && audioEl.src) playHistory.push(currentSongIdx);
    currentSongIdx = i; audioEl.src = s.src; $('current-song-name').innerText = s.name;
    audioEl.play().then(() => { $('play-pause-btn').innerText = '⏸️'; }).catch(() => { $('play-pause-btn').innerText = '▶️'; });
    renderPlaylist();
  }
  function pickNext() {
    const ok = playable(); if (!ok.length) return -1;
    if (shuffleOn) {
      shuffleBag = shuffleBag.filter(i => ok.includes(i) && i !== currentSongIdx);
      if (!shuffleBag.length) {
        shuffleBag = ok.filter(i => i !== currentSongIdx || ok.length === 1);
        for (let k = shuffleBag.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [shuffleBag[k], shuffleBag[j]] = [shuffleBag[j], shuffleBag[k]]; }
      }
      return shuffleBag.pop();
    }
    let i = currentSongIdx, n = playlist.length; do { i = (i + 1) % n; } while (playlist[i].missing);
    return i;
  }
  function nextSong() { const n = pickNext(); if (n >= 0) playSong(n); }
  function prevSong() {
    if (audioEl.currentTime > 3) { audioEl.currentTime = 0; return; }
    while (playHistory.length) { const p = playHistory.pop(); if (playlist[p] && !playlist[p].missing) return playSong(p, true); }
    if (shuffleOn || !playlist.length) { audioEl.currentTime = 0; return; }
    let i = currentSongIdx, n = playlist.length; do { i = (i - 1 + n) % n; } while (playlist[i].missing); playSong(i, true);
  }
  function togglePlay() {
    if (!audioEl.getAttribute('src')) { const ok = playable(); if (ok.length) playSong(shuffleOn ? ok[Math.floor(Math.random() * ok.length)] : (ok.includes(currentSongIdx) ? currentSongIdx : ok[0]), true); return; }
    if (audioEl.paused) { audioEl.play().catch(() => {}); $('play-pause-btn').innerText = '⏸️'; } else { audioEl.pause(); $('play-pause-btn').innerText = '▶️'; }
  }
  function startMusic() {              // al entrar al portafolio
    const ok = playable(); if (!ok.length) return;
    playSong(shuffleOn ? ok[Math.floor(Math.random() * ok.length)] : ok[0], true);
  }
  function toggleShuffle() { shuffleOn = !shuffleOn; shuffleBag = []; lsSet('mlp_shuffle', shuffleOn); paintModes(); toast(shuffleOn ? '🔀 Modo aleatorio activado' : 'Modo aleatorio desactivado'); }
  function cycleRepeat() { repeatMode = { all: 'one', one: 'off', off: 'all' }[repeatMode] || 'all'; lsSet('mlp_repeat', repeatMode); paintModes(); toast({ all: '🔁 Repetir toda la lista', one: '🔂 Repetir esta canción', off: 'Sin repetir' }[repeatMode]); }
  function paintModes() {
    const s = $('shuffle-btn'), r = $('repeat-btn');
    s.classList.toggle('on', shuffleOn); s.setAttribute('aria-pressed', String(shuffleOn));
    r.classList.toggle('on', repeatMode !== 'off'); r.innerText = repeatMode === 'one' ? '🔂' : '🔁'; r.title = { all: 'Repetir lista', one: 'Repetir canción', off: 'Sin repetir' }[repeatMode];
  }

  async function removeSong(i) {
    const it = playlist[i], wasCurrent = i === currentSongIdx;
    playlist.splice(i, 1); playHistory = []; shuffleBag = [];
    if (it.kind === 'local') { try { await IDB.del('song:' + it.id); } catch (e) {} if (it.src) URL.revokeObjectURL(it.src); }
    if (i < currentSongIdx) currentSongIdx--;
    if (wasCurrent) {
      audioEl.pause(); audioEl.removeAttribute('src'); $('play-pause-btn').innerText = '▶️'; $('current-song-name').innerText = 'Sin reproducción';
      currentSongIdx = Math.min(currentSongIdx, Math.max(0, playlist.length - 1));
      if (playable().length) { const n = pickNext(); if (n >= 0) playSong(n, true); }
    }
    savePlaylist(); renderPlaylist(); toast('Canción quitada de la lista');
  }
  async function uploadSong(e) {
    const files = [...e.target.files]; e.target.value = ''; let last = -1, failed = false;
    for (const f of files) {
      if (!f.type.startsWith('audio/') && !/\.(mp3|wav|ogg|m4a|aac|flac|opus)$/i.test(f.name)) { toast(`"${f.name}" no parece un archivo de audio.`); continue; }
      const id = uid();
      try { await IDB.put('song:' + id, f); } catch (err) { failed = true; }
      playlist.push({ id, name: f.name.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ').trim() || 'Canción', blob: f, src: URL.createObjectURL(f), kind: 'local' }); last = playlist.length - 1;
    }
    if (last >= 0) { savePlaylist(); renderPlaylist(); playSong(last); toast(failed ? '⚠ Suena ahora, pero este navegador no permite guardarla.' : '🎵 Canción guardada en este navegador'); }
  }
  $('song-url').addEventListener('keydown', e => {
    const v = e.target.value.trim(); if (e.key !== 'Enter' || !v) return;
    if (!/^https?:\/\//i.test(v)) return toast('Pega una dirección que empiece por http:// o https://');
    const nm = decodeURIComponent(v.split('/').pop().split('?')[0] || 'Canción').replace(/\.[^.]+$/, '');
    playlist.push({ id: uid(), name: nm, url: v, src: v, kind: 'url' }); e.target.value = ''; savePlaylist(); renderPlaylist(); toast('Canción añadida');
  });

  audioEl.addEventListener('ended', () => {
    if (repeatMode === 'one') { audioEl.currentTime = 0; audioEl.play().catch(() => {}); return; }
    const n = pickNext();
    if (n < 0) return;
    if (repeatMode === 'off' && !shuffleOn && n <= currentSongIdx) { $('play-pause-btn').innerText = '▶️'; return; }
    playSong(n);
  });
  audioEl.addEventListener('error', () => { if (audioEl.getAttribute('src')) { $('current-song-name').innerText = '⚠ No se pudo reproducir esta canción'; $('play-pause-btn').innerText = '▶️'; } });
  audioEl.addEventListener('timeupdate', () => { const d = audioEl.duration; if (isFinite(d) && d > 0) $('seek').value = Math.round(audioEl.currentTime / d * 1000); $('mp-time').textContent = fmtTime(audioEl.currentTime) + ' / ' + fmtTime(d); });
  $('seek').addEventListener('input', e => { if (isFinite(audioEl.duration)) audioEl.currentTime = e.target.value / 1000 * audioEl.duration; });
  const savedVol = lsGet('mlp_vol', 80); $('vol').value = savedVol; audioEl.volume = savedVol / 100;
  $('vol').addEventListener('input', e => { audioEl.volume = e.target.value / 100; lsSet('mlp_vol', +e.target.value); });
  paintModes();

  function minimizePlayer() { $('music-player').style.display = "none"; $('music-bubble').style.display = "flex"; }
  function maximizePlayer() { $('music-bubble').style.display = "none"; $('music-player').style.display = "block"; }
</script></body></html>
