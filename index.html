<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portafolio Ciberseguridad - Equestria Edition</title>
<style>
  :root {
    --bg-color: #0d0914; --text-color: #f3e8ff; --primary: #6b21a8; --secondary: #ec4899;
    --accent: #3b82f6; --card-bg: rgba(30, 20, 50, 0.85); --bubble-bg: rgba(107, 33, 168, 0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background-color: var(--bg-color); color: var(--text-color); transition: background-color .5s, color .5s; overflow-x: hidden; min-height: 100vh; position: relative; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .15;
    background-image: radial-gradient(var(--secondary) 2px, transparent 2px); background-size: 30px 30px; }

  /* Advertencia */
  #warning-modal { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 99999; text-align: center; padding: 20px; }
  #warning-modal h1 { font-size: 4.5rem; color: #ff2a55; text-shadow: 0 0 20px #ff2a55; animation: pulse 1s infinite alternate; margin-bottom: 10px; }
  #warning-modal p { font-size: 1.8rem; color: #fff; margin-bottom: 30px; }
  #warning-modal button { padding: 15px 40px; font-size: 1.2rem; font-weight: bold; background: var(--primary); color: #fff; border: 2px solid var(--secondary); border-radius: 30px; cursor: pointer; transition: .3s; }
  #warning-modal button:hover { transform: scale(1.1); background: var(--secondary); }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }

  header { position: sticky; top: 0; z-index: 1000; background: var(--card-bg); backdrop-filter: blur(10px); border-bottom: 3px solid var(--primary); padding: 8px 20px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
  .pony-menu { display: flex; gap: 8px; flex-wrap: wrap; }
  .pony-btn { padding: 4px 14px 4px 8px; border-radius: 20px; border: 2px solid transparent; cursor: pointer; font-weight: bold; font-size: .9rem; transition: transform .2s, box-shadow .2s; color: #fff; display: flex; align-items: center; gap: 6px; }
  .pony-btn img { height: 34px; width: auto; image-rendering: pixelated; }
  .pony-btn:hover { transform: translateY(-3px); box-shadow: 0 4px 12px rgba(0,0,0,.3); }
  .pony-btn.active { border-color: #fff; transform: scale(1.06); }
  .mode-controls { display: flex; gap: 10px; align-items: center; }
  .mode-badge { padding: 5px 12px; border-radius: 12px; font-size: .85rem; font-weight: bold; background: var(--secondary); color: #fff; }
  .btn-action { padding: 8px 15px; border-radius: 8px; border: none; cursor: pointer; background: var(--primary); color: #fff; font-weight: bold; }

  main { position: relative; z-index: 10; max-width: 1200px; margin: 24px auto; padding: 22px; background: var(--card-bg); border-radius: 20px; border: 2px solid var(--primary); box-shadow: 0 10px 30px rgba(0,0,0,.3); transition: opacity .8s ease, transform .8s ease, filter .8s ease, box-shadow .8s ease; }
  .pony-header-info { display: flex; align-items: center; gap: 15px; border-bottom: 2px dashed var(--secondary); padding-bottom: 15px; margin-bottom: 18px; }
  #pony-icon img { height: 64px; width: auto; image-rendering: pixelated; display: block; }
  button { font-family: inherit; }

  /* ===== Estructura: menú lateral + contenido ===== */
  .layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 20px; align-items: start; }
  #nav-toggle { display: none; margin-bottom: 12px; }
  #sidebar { position: sticky; top: 76px; max-height: calc(100vh - 100px); overflow: auto; background: rgba(128,128,128,.1); border: 1px solid var(--primary); border-radius: 14px; padding: 10px; }
  #sidebar h4 { color: var(--secondary); margin: 2px 6px 8px; font-size: .95rem; letter-spacing: .03em; }
  .nav-row { display: flex; align-items: center; gap: 1px; }
  .nav-item { flex: 1; text-align: left; background: none; border: none; color: var(--text-color); padding: 7px 9px; border-radius: 8px; cursor: pointer; font-size: .92rem; line-height: 1.25; }
  .nav-item:hover { background: var(--bubble-bg); }
  .nav-item.active { background: var(--primary); color: #fff; font-weight: 700; }
  .nav-sub { margin: 0 0 2px 12px; border-left: 2px solid var(--secondary); padding-left: 6px; }
  .mini { background: none; border: none; cursor: pointer; color: var(--text-color); opacity: .7; font-size: .78rem; padding: 3px 4px; border-radius: 5px; }
  .mini:hover { opacity: 1; background: rgba(128,128,128,.25); }
  .mini.armed { background: #ef4444; color: #fff; opacity: 1; }
  .nav-add { width: 100%; margin-top: 8px; }

  .crumbs { font-size: .82rem; opacity: .85; margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .crumbs button { background: none; border: none; color: var(--secondary); cursor: pointer; font-size: inherit; padding: 0; text-decoration: underline; }
  .page-head { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .page-head h1 { font-size: 1.8rem; line-height: 1.2; }
  .page-head p { opacity: .85; margin-top: 4px; }
  .btn-ghost { background: transparent; border: 2px solid var(--primary); color: var(--text-color); padding: 7px 13px; border-radius: 8px; cursor: pointer; font-weight: 700; }
  .btn-ghost:hover { background: var(--primary); color: #fff; }
  .btn-action:disabled { opacity: .5; cursor: default; }
  .pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; flex-wrap: wrap; }

  /* ===== Bloques de contenido ===== */
  .portfolio-item { background: rgba(128,128,128,.1); border-left: 5px solid var(--secondary); padding: 18px; margin-bottom: 18px; border-radius: 10px; position: relative; transition: transform .8s; }
  .blk-title { color: var(--secondary); margin-bottom: 10px; font-size: 1.3rem; }
  .txt-normal p, .txt-slide p, .rv-part p, .acc-body p, .card-part p { line-height: 1.65; margin: 0 0 .55em; }
  .txt-normal ul, .txt-normal ol, .txt-slide ul, .txt-slide ol, .rv-part ul, .rv-part ol, .acc-body ul, .card-part ul { margin: .3em 0 .8em 1.4em; line-height: 1.6; }
  .txt-normal h4, .txt-normal h5, .txt-normal h6, .txt-slide h4, .txt-slide h5, .rv-part h4, .card-part h4 { color: var(--secondary); margin: .7em 0 .3em; }
  code { font-family: Consolas, 'Courier New', monospace !important; background: rgba(128,128,128,.25); padding: 1px 5px; border-radius: 4px; font-size: .92em; }
  .txt-normal a, .txt-slide a, .rv-part a, .acc-body a { color: var(--secondary); }
  .empty-note { opacity: .6; font-style: italic; padding: 10px; }

  /* Acordeón */
  .acc { margin: 6px 0; background: rgba(128,128,128,.12); border-radius: 10px; border: 1px solid var(--primary); overflow: hidden; }
  .acc summary { cursor: pointer; padding: 11px 14px; font-weight: 700; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
  .acc summary::after { content: '▾'; transition: transform .3s; }
  .acc[open] summary::after { transform: rotate(180deg); }
  .acc[open] summary { background: var(--bubble-bg); }
  .acc-body { padding: 4px 14px 10px; animation: rvUp .45s both; }
  /* Tarjetas */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .card-part { background: rgba(128,128,128,.12); border: 1px solid var(--primary); border-radius: 12px; padding: 14px; transition: transform .25s, box-shadow .25s; }
  .card-part:hover { transform: translateY(-4px); box-shadow: 0 8px 18px rgba(0,0,0,.25); }
  .card-part h4 { margin-top: 0; }
  /* Aparecer por partes */
  .rv-btns { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .rv-part { margin: 6px 0; padding: 10px 14px; background: rgba(128,128,128,.1); border-radius: 10px; border-left: 4px solid var(--secondary); }
  .rv-part.fresh { animation-duration: .65s; animation-fill-mode: both; }
  .rv-part.fresh.rv-slide { animation-name: rvSlide; } .rv-part.fresh.rv-fade { animation-name: rvFade; }
  .rv-part.fresh.rv-zoom { animation-name: rvZoom; } .rv-part.fresh.rv-flip { animation-name: rvFlip; } .rv-part.fresh.rv-up { animation-name: rvUp; }
  @keyframes rvSlide { from { opacity: 0; transform: translateX(-60px); } }
  @keyframes rvFade { from { opacity: 0; } }
  @keyframes rvZoom { from { opacity: 0; transform: scale(.5); } }
  @keyframes rvFlip { from { opacity: 0; transform: perspective(700px) rotateX(-90deg); } }
  @keyframes rvUp { from { opacity: 0; transform: translateY(30px); } }

  /* ===== Presentación de diapositivas (texto e imágenes) ===== */
  .ss { position: relative; background: rgba(128,128,128,.12); border: 1px solid var(--primary); border-radius: 14px; padding: 10px 10px 46px; outline: none; }
  .ss:focus-visible { box-shadow: 0 0 0 3px var(--secondary); }
  .ss-stage { display: grid; overflow: hidden; border-radius: 10px; perspective: 1200px; }
  .ss-slide { grid-area: 1 / 1; padding: 18px 60px; opacity: 0; visibility: hidden; pointer-events: none; transition: transform .6s ease, opacity .6s ease, visibility 0s linear .6s; }
  .ss-slide.on { opacity: 1; visibility: visible; pointer-events: auto; transform: none !important; transition: transform .6s ease, opacity .6s ease, visibility 0s; }
  .tr-slide .before { transform: translateX(-100%); } .tr-slide .after { transform: translateX(100%); }
  .tr-zoom .before, .tr-zoom .after { transform: scale(.55); }
  .tr-flip .before { transform: rotateY(-90deg); } .tr-flip .after { transform: rotateY(90deg); }
  .tr-up .before { transform: translateY(-70px); } .tr-up .after { transform: translateY(70px); }
  .ss-nav { position: absolute; top: 50%; transform: translateY(-70%); width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--primary); color: #fff; font-size: 1.3rem; cursor: pointer; z-index: 2; opacity: .85; }
  .ss-nav:hover { opacity: 1; transform: translateY(-70%) scale(1.1); }
  .ss-prev { left: 12px; } .ss-next { right: 12px; }
  .ss-dots { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; max-width: 70%; flex-wrap: wrap; justify-content: center; }
  .ss-dot { width: 10px; height: 10px; border-radius: 50%; border: none; background: rgba(128,128,128,.55); cursor: pointer; padding: 0; }
  .ss-dot.on { background: var(--secondary); transform: scale(1.3); }
  .ss-count { position: absolute; bottom: 10px; right: 14px; font-size: .78rem; opacity: .75; }
  .txt-slide { font-size: 1.12rem; min-height: 130px; display: flex; flex-direction: column; justify-content: center; }
  .ss figure { margin: 0; text-align: center; }
  .ss figure img { max-width: 100%; max-height: 62vh; object-fit: contain; border-radius: 8px; cursor: zoom-in; }
  .ss figcaption { margin-top: 8px; font-size: .95rem; white-space: pre-wrap; opacity: .92; }

  /* ===== Galerías de imágenes ===== */
  .gal { --cols: 3; }
  .gal figure { margin: 0; }
  .gal img { display: block; width: 100%; border-radius: 8px; border: 2px solid var(--primary); cursor: zoom-in; transition: transform .25s, box-shadow .25s; background: rgba(128,128,128,.15); }
  .gal img:hover { transform: scale(1.025); box-shadow: 0 8px 18px rgba(0,0,0,.35); }
  .gal figcaption { font-size: .82rem; margin-top: 4px; opacity: .9; white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .gal-mosaic { column-count: var(--cols); column-gap: 10px; }
  .gal-mosaic figure { break-inside: avoid; margin-bottom: 10px; }
  .gal-grid { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 10px; }
  .gal-grid img { aspect-ratio: 4 / 3; object-fit: cover; }
  .gal-collage { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 130px; grid-auto-flow: dense; gap: 8px; }
  .gal-collage figure { position: relative; overflow: hidden; border-radius: 8px; }
  .gal-collage figure:nth-child(5n+1) { grid-column: span 2; grid-row: span 2; }
  .gal-collage figure:nth-child(5n+4) { grid-column: span 2; }
  .gal-collage img { height: 100%; object-fit: cover; }
  .gal-collage figcaption { position: absolute; left: 0; right: 0; bottom: 0; margin: 0; padding: 14px 8px 6px; background: linear-gradient(transparent, rgba(0,0,0,.75)); color: #fff; opacity: 0; transition: opacity .25s; }
  .gal-collage figure:hover figcaption { opacity: 1; }
  .gal-strip { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px; }
  .gal-strip figure { flex: 0 0 min(280px, 70%); scroll-snap-align: start; }
  .gal-strip img { height: 190px; object-fit: cover; }
  .gal-list figure { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; margin-bottom: 16px; }
  .gal-list img { width: auto; max-width: min(100%, 560px); max-height: 420px; object-fit: contain; }
  .gal-list figcaption { flex: 1 1 220px; font-size: .98rem; -webkit-line-clamp: unset; display: block; }
  @media (max-width: 700px) {
    .gal-mosaic { column-count: 2; } .gal-grid { grid-template-columns: repeat(2, 1fr); }
    .gal-collage { grid-template-columns: repeat(2, 1fr); } .ss-slide { padding: 14px 44px; }
  }

  /* ===== Visor de imagen completa y modo presentación (por debajo de las ponys y la música) ===== */
  #lightbox, #present { position: fixed; inset: 0; z-index: 3500; display: none; flex-direction: column; background: rgba(8, 6, 16, .99); color: #f3e8ff; }
  #lightbox.on, #present.on { display: flex; }
  .lb-top, .pr-top { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; }
  #lb-caption { flex: 1; max-height: 22vh; overflow: auto; white-space: pre-wrap; font-size: 1rem; line-height: 1.5; }
  .lb-btn { background: rgba(255,255,255,.14); color: #fff; border: none; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 1rem; }
  .lb-btn:hover { background: var(--secondary); }
  .lb-stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 64px 20px; overflow: auto; }
  #lb-img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; cursor: zoom-in; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  #lb-img.zoom { max-width: none; max-height: none; cursor: zoom-out; margin: auto; }
  .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.14); color: #fff; border: none; width: 46px; height: 64px; font-size: 2rem; cursor: pointer; border-radius: 10px; }
  .lb-nav:hover { background: var(--secondary); } #lb-prev { left: 8px; } #lb-next { right: 8px; }
  #lb-count { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); font-size: .85rem; opacity: .8; }
  .pr-top { align-items: center; justify-content: space-between; }
  .pr-top select { padding: 6px; border-radius: 6px; background: #1d1530; color: #fff; border: 1px solid var(--primary); }
  .pr-stage { flex: 1; min-height: 0; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 6px 20px 24px; }
  .pr-stage .ss { width: min(1100px, 100%); background: transparent; border-color: rgba(255,255,255,.2); color: #f3e8ff; }
  .pr-stage .txt-slide { font-size: clamp(1.2rem, 2.8vw, 2.1rem); min-height: 40vh; }
  .pr-stage .ss figure img { max-height: 66vh; }
  .pr-title { text-align: center; padding: 8vh 0; } .pr-title h1 { font-size: clamp(2rem, 6vw, 3.6rem); } .pr-ico { font-size: 4rem; } .pr-title p { margin-top: 12px; font-size: 1.3rem; opacity: .85; }

  /* Presentación: contenido centrado en la pantalla */
  .pr-stage .ss { min-height: 72vh; display: flex; flex-direction: column; }
  .pr-stage .ss-stage { flex: 1; }
  .pr-stage .ss-slide { display: flex; align-items: center; justify-content: center; text-align: center; }
  .pr-stage .ss-slide > * { width: 100%; }
  .pr-stage .txt-slide { align-items: center; min-height: 0; }
  .pr-stage .txt-slide ul, .pr-stage .txt-slide ol { display: inline-block; text-align: left; }
  .icon-pal summary { cursor: pointer; font-size: .82rem; margin-top: 8px; opacity: .9; }
  .icon-grid { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .icon-grid .btn-mini { font-size: 1.15rem; padding: 3px 7px; }

  /* ===== Página de inicio: índice ===== */
  .home-index h2 { color: var(--secondary); margin: 8px 0 12px; }
  .idx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .idx-card { display: flex; gap: 12px; background: rgba(128,128,128,.12); border: 2px solid var(--primary); border-radius: 14px; padding: 14px; cursor: pointer; transition: transform .25s, box-shadow .25s, border-color .25s; }
  .idx-card:hover { transform: translateY(-4px); box-shadow: 0 10px 22px rgba(0,0,0,.3); border-color: var(--secondary); }
  .idx-icon { font-size: 2.2rem; line-height: 1; }
  .idx-body p { font-size: .88rem; opacity: .85; margin: 3px 0 6px; }
  .idx-kids { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .chip { background: var(--bubble-bg); border: 1px solid var(--primary); color: var(--text-color); border-radius: 14px; padding: 2px 9px; font-size: .78rem; cursor: pointer; }
  .chip:hover { background: var(--secondary); color: #fff; }
  .idx-card.add { border-style: dashed; align-items: center; justify-content: center; font-weight: 700; min-height: 90px; }

  /* ===== Modo Alumno: editor ===== */
  #admin-bar { display: none; background: rgba(0,0,0,.18); border: 2px dashed var(--accent); border-radius: 14px; padding: 12px; margin-bottom: 16px; }
  #admin-bar .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  #admin-bar .row:first-child { margin-top: 0; }
  #save-status { font-size: .82rem; opacity: .9; }
  #save-status.warn { color: #f87171; font-weight: 700; opacity: 1; }
  .ed input[type=text], .ed input[type=number], .ed textarea, .ed select, .page-props input, .page-props select, #admin-bar input[type=text] { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--primary); background: var(--bg-color); color: var(--text-color); font-size: .93rem; }
  .ed textarea { resize: vertical; min-height: 110px; line-height: 1.5; }
  .ed label, .page-props label { display: block; font-size: .78rem; font-weight: 700; opacity: .85; margin: 8px 0 3px; }
  .ed .inline { display: flex; flex-wrap: wrap; gap: 12px; }
  .ed .inline > div { flex: 1 1 170px; }
  .ed .chk { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: .88rem; }
  .ed .chk input { width: auto; }
  .ed .hint, .hint { font-size: .78rem; opacity: .75; margin-top: 5px; line-height: 1.4; }
  .page-props { background: rgba(0,0,0,.15); border: 1px dashed var(--accent); border-radius: 12px; padding: 10px 12px; margin-bottom: 16px; }
  .page-props .inline { display: flex; flex-wrap: wrap; gap: 10px; } .page-props .inline > div { flex: 1 1 150px; }
  .page-props .inline > div.ico { flex: 0 0 80px; }
  .blk-wrap { border-left-color: var(--accent); }
  .blk-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
  .blk-bar .sp { flex: 1; }
  .btn-mini { background: rgba(128,128,128,.25); border: none; color: var(--text-color); padding: 5px 10px; border-radius: 7px; cursor: pointer; font-size: .82rem; font-weight: 700; }
  .btn-mini:hover { background: var(--primary); color: #fff; } .btn-mini.armed { background: #ef4444; color: #fff; }
  .blk-prev-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; opacity: .6; margin: 14px 0 6px; }
  .blk-preview { border-top: 1px dashed rgba(128,128,128,.5); padding-top: 10px; }
  .add-bar { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0 4px; }
  .dropzone { border: 2px dashed var(--accent); border-radius: 12px; padding: 14px; text-align: center; margin: 10px 0; font-size: .9rem; transition: background .2s; }
  .dropzone.over { background: var(--bubble-bg); }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; margin-top: 10px; }
  .thumb { background: rgba(0,0,0,.18); border: 2px solid transparent; border-radius: 10px; padding: 6px; }
  .thumb.over { border-color: var(--secondary); background: var(--bubble-bg); }
  .thumb img { width: 100%; height: 105px; object-fit: cover; border-radius: 6px; cursor: grab; display: block; }
  .thumb textarea { min-height: 62px !important; margin-top: 6px; font-size: .8rem !important; }
  .thumb .tb { display: flex; justify-content: space-between; gap: 3px; margin-top: 5px; }
  #toast { max-width: 90vw; text-align: center; }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    #nav-toggle { display: inline-block; }
    #sidebar { display: none; position: static; max-height: none; margin-bottom: 14px; }
    #sidebar.open { display: block; }
    main { padding: 14px; margin: 12px 8px; }
  }

  /* Diálogos propios (los iframes de Google Sites pueden bloquear prompt/alert/confirm) */
  #dialog { position: fixed; inset: 0; z-index: 99998; background: rgba(0,0,0,.6); display: none; justify-content: center; align-items: center; }
  #dialog .box { background: var(--card-bg); border: 2px solid var(--secondary); border-radius: 14px; padding: 20px; width: min(90vw, 360px); backdrop-filter: blur(10px); }
  #dialog .box input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid var(--primary); background: var(--bg-color); color: var(--text-color); }
  #dialog .msg { font-size: .85rem; color: #fca5a5; min-height: 1.1em; }
  #toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: #111; color: #fff; padding: 8px 16px; border-radius: 10px; z-index: 99997; display: none; font-size: .9rem; }

  /* ===== MASCOTA (sprites de GIF animados) ===== */
  #shimeji-container { position: fixed; left: 0; top: 0; z-index: 5000; user-select: none; touch-action: none; }

  #speech-bubble { background: #fff; color: #111; padding: 12px 16px; border-radius: 15px; border: 3px solid var(--primary); width: max-content; max-width: 270px; font-size: .9rem; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,.3); cursor: pointer; display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 12px; text-align: center; }

  #context-menu { position: fixed; background: var(--card-bg); border: 2px solid var(--secondary); border-radius: 10px; padding: 8px 0; z-index: 6000; display: none; box-shadow: 0 5px 15px rgba(0,0,0,.5); min-width: 170px; }

  /* ===== SABOTAJES ===== */
  #sabotage-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 3000; overflow: hidden; }

  /* Twilight */
  main.aura { box-shadow: 0 0 0 4px #d946ef, 0 0 60px 20px rgba(217,70,239,.8), inset 0 0 40px rgba(217,70,239,.5); animation: levitate 1.6s ease-in-out infinite; }
  @keyframes levitate { 0%,100% { transform: translateY(-8px) rotate(-.6deg); } 50% { transform: translateY(-26px) rotate(.6deg); } }
  main.poof { opacity: 0 !important; transform: scale(.05) translateY(-40vh) !important; filter: blur(8px) brightness(3); }
  .spark { font-size: 1.6rem; animation: sparkle 1.4s ease-out forwards; }
  @keyframes sparkle { 0% { transform: scale(0) rotate(0); opacity: 1; } 60% { opacity: 1; } 100% { transform: scale(1.8) rotate(200deg) translateY(-60px); opacity: 0; } }
  .smoke { border-radius: 50%; background: radial-gradient(circle, rgba(217,70,239,.9), rgba(107,33,168,.4), transparent 70%); animation: smokeGrow 1.6s ease-out forwards; }
  @keyframes smokeGrow { from { transform: scale(.2); opacity: 1; } to { transform: scale(2.4); opacity: 0; } }

  /* Rainbow Dash */
  .rb-trail { position: absolute; left: -120%; width: 120%; height: 34px; animation: rbRun .88s linear forwards; border-radius: 20px; }
  @keyframes rbRun { to { left: 110%; } }
  .rb-ring { border: 14px solid #fff; border-radius: 50%; box-shadow: 0 0 40px #38bdf8, inset 0 0 40px #f472b6; animation: ringGo 1.1s ease-out forwards; }
  @keyframes ringGo { from { transform: scale(.05); opacity: 1; } to { transform: scale(14); opacity: 0; } }
  main.blown { transform: translateX(160vw) rotate(25deg) skewX(-25deg) !important; filter: blur(6px); opacity: 0; transition: transform .7s cubic-bezier(.6,0,1,.6), filter .7s, opacity .7s; }

  /* Applejack */
  main.shake { animation: treeShake .12s linear 12; }
  @keyframes treeShake { 0%,100% { transform: translateX(0) rotate(0); } 25% { transform: translateX(-10px) rotate(-1deg); } 75% { transform: translateX(10px) rotate(1deg); } }
  main.dropped { transform: translateY(125vh) rotate(8deg) !important; transition: transform 1s cubic-bezier(.5,0,1,.5); }
  .apple { font-size: 2.6rem; top: -80px; animation: appleFall 1.4s cubic-bezier(.5,0,1,.6) forwards; }
  @keyframes appleFall { 0% { transform: translateY(0) rotate(0); } 85% { transform: translateY(var(--drop)) rotate(300deg); } 92% { transform: translateY(calc(var(--drop) - 40px)) rotate(330deg); } 100% { transform: translateY(var(--drop)) rotate(360deg); } }
  .dust { font-size: 2rem; opacity: .7; animation: dustPuff 1.2s ease-out forwards; }

  .confetti { width: 10px; height: 16px; top: -20px; animation: confFall linear forwards; }
  @keyframes confFall { to { transform: translateY(110vh) rotate(720deg); } }
  .balloon { bottom: -120px; font-size: 4rem; animation: balloonUp 3s ease-out forwards, balloonSway 2s ease-in-out infinite; }

  @keyframes balloonSway { 0%,100% { margin-left: -12px; } 50% { margin-left: 12px; } }
  .streamer { top: 0; width: 8px; height: 0; animation: streamerDrop 1.2s ease-out forwards; border-radius: 4px; }
  @keyframes streamerDrop { to { height: var(--len); } }
  .party-banner { top: 38%; left: 50%; transform: translate(-50%,-50%) rotate(-4deg); font-size: clamp(2rem, 7vw, 4.5rem); font-weight: 900; color: #fff; text-shadow: 4px 4px 0 #db2777, 8px 8px 0 #38bdf8; white-space: nowrap; animation: bannerPop .6s cubic-bezier(.2,2,.4,1) both; }
  @keyframes bannerPop { from { transform: translate(-50%,-50%) scale(0) rotate(-30deg); } }
  main.party { filter: saturate(2.2) hue-rotate(40deg) blur(1px); animation: partyBounce .5s ease-in-out infinite; }
  @keyframes partyBounce { 0%,100% { transform: scale(1); } 50% { transform: scale(1.02) rotate(.5deg); } }

  /* Rarity */
  .fabric { inset: 0; background: repeating-linear-gradient(45deg, #ede9fe, #ede9fe 22px, #ddd6fe 22px, #ddd6fe 44px); border: 14px dashed #7e22ce; transform: translateY(-105%); transition: transform .9s cubic-bezier(.3,1.2,.4,1); pointer-events: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; overflow: auto; }

  @keyframes flicker { from { transform: scaleY(.85) skewX(-6deg); } to { transform: scaleY(1.25) skewX(6deg); } }
  .scroll { top: 38%; left: 50%; transform: translate(-50%,-50%) rotate(-3deg); width: min(88vw, 480px); background: #fef3c7; color: #3b2a14; border: 3px solid #a16207; border-radius: 10px; padding: 22px; box-shadow: 0 0 40px #bef264; animation: scrollIn 1s cubic-bezier(.3,1.4,.5,1) both; text-align: center; }
