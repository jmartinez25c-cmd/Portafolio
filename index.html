  <input type="file" id="import-file" accept=".json,application/json" style="display:none">
  <script id="site-data" type="application/json">{"v":1,"savedAt":1795274226511,"title":"Portafolio de Ciberseguridad","pages":[{"id":"home","title":"Inicio","icon":"🏠","summary":"","parent":null,"transition":"slide","blocks":[{"id":"xmwq4qfgazhj9","type":"text","title":"Bienvenida","body":"Este portafolio recoge mi proceso de aprendizaje en la asignatura de Seguridad Informática de segundo de SMR. A través de los diferentes temas, actividades y evidencias, presento los conocimientos adquiridos, las prácticas realizadas y mi evolución durante la evaluación. ","mode":"cards","transition":"slide","autoplay":false,"interval":6}]},{"id":"t1","title":"Fundamentos de Ciberseguridad","icon":"🛡️","summary":"","parent":null,"transition":"up","blocks":[{"id":"xmwq4qfgarpmk","type":"text","title":"","body":"La seguridad informática es el conjunto de protocolos, métodos y técnicas destinados a proteger el almacenamiento, procesamiento y transmisión de la información digital. En este primer tema nos adentramos en los pilares esenciales de la ciberseguridad, analizando cómo identificar los activos vulnerables de un sistema y cómo evaluarlos mediante auditorías de seguridad profesional con herramientas como Lynis. La relación directa con la seguridad informática radica en la necesidad de pasar de una postura reactiva a una prevención proactiva de amenazas.","mode":"cards","transition":"slide","autoplay":false,"interval":6},{"id":"xmwq6bzhvs2m7","type":"text","title":"Conceptos:","body":"**Tríada CID:**\n**-Confidencialidad:** Garantizar que la información solo sea accesible por            usuarios autorizados mediante autenticación, autorización y cifrado.\n** -Integridad:** Asegurar que los datos queden almacenados tal y como el usuario espera, evitando modificaciones no autorizadas.\n**-Disponibilidad:** Garantizar que los usuarios puedan acceder a los servicios e información en el horario establecido.\n","mode":"accordion","transition":"slide","autoplay":false,"interval":6},{"id":"xmwq6kvhptxx4","type":"text","title":"","body":"**No Repudio:** Garantía de que ninguna de las partes implicadas en una comunicación pueda negar su participación.\n**Seguridad Activa vs. Pasiva:** La seguridad activa previene incidentes (contraseñas, firewalls, antivirus); la pasiva minimiza los daños una vez ocurrido el ataque (SAI, copias de seguridad, discos redundantes).\n**Seguridad Física vs. Lógica:** La física protege los equipos de amenazas como desastres o robos; la lógica protege la información y software contra malware y accesos no autorizados.\n**Vulnerabilidad, Malware y Exploit:** Una vulnerabilidad es un fallo en el software; el malware es el programa malicioso que intenta dañarlo; y el exploit es el código que aprovecha la vulnerabilidad para tomar el control.","mode":"slides","transition":"slide","autoplay":true,"interval":6}]},{"id":"t1a","title":"Objetivos y Terminología de la Seguridad Informática","icon":"🛡️","summary":"","parent":"t1","transition":"slide","blocks":[{"id":"xmwq4qfgal8sj","type":"text","title":"Estudio de la Importancia de Proteger los Activos Digitales","body":"****\n**-Importancia de la protección:** En la era digital, las operaciones clave de las organizaciones dependen de los sistemas informáticos. Por eso es vital cuidar la integridad y confidencialidad de la información. \n**-Equipos:** Es clave evitar el robo físico o de partes, hacer mantenimiento preventivo y usar cifrado en dispositivos portátiles. \n**-Aplicaciones:** Hay que protegerlas controlando los permisos de administración y evitando la ejecución o instalación de software no autorizado o malicioso. \n**-Datos:** Son el activo más valioso. Si se pierden o se filtran a la competencia, el futuro de la empresa se pone en riesgo. Por eso, se necesita almacenamiento redundante y copias de seguridad.\n**-Comunicaciones:** Requieren el uso de conexiones cifradas y filtros contra spam para evitar la intercepción de tráfico y ataques en la red.","mode":"cards","transition":"up","autoplay":true,"interval":6},{"id":"xmwq6q04ggw60","type":"text","title":"Tipos de Ataques, Atacantes y Normativa","body":"**Tipos de ataques**\n**-DoS / DDoS:** Saturación de servicios mediante falsas peticiones para tumbar un servidor, ya sea desde uno o varios equipos zombie. \n**-Phishing:** Engaño suplantando la identidad de entidades legítimas para captar credenciales de acceso. \n**-Fuerza Bruta:** Generación y prueba sistemática de combinaciones de claves hasta encontrar la correcta. \n**-Keyloggers:** Malware que guarda las pulsaciones de teclado para robar contraseñas. \n**-Spoofing:** Alteración de la identidad de una máquina para hacerse pasar por otra en la red.\n\n**Tipos de atacantes**\n**-Hacker:** Ataca sistemas por el reto técnico y con la ética de reportar las vulnerabilidades encontradas. \n**-Cracker:** Entra sin permiso con la intención de causar daño, robar datos o dejar servicios fuera de uso. \n**-Script Kiddie:** Principiante que usa herramientas o scripts de otros sin entender bien cómo funcionan o sus consecuencias.\n\n**Normativa de protección de datos (LOPD)**\nRegula el manejo de datos personales y establece tres niveles de seguridad. Básico: identificación y copias de seguridad semanales. Medio: control de acceso físico y auditorías cada dos años. Alto: cifrado de comunicaciones y registro detallado de operaciones.","mode":"accordion","transition":"slide","autoplay":false,"interval":6}],"iconAuto":true},{"id":"t1b","title":"Docker","icon":"✅","summary":"","parent":"t1","transition":"slide","blocks":[{"id":"xmwq4qfgafydc","type":"text","title":"","body":"**¿Qué es Docker?**\nDocker es un proyecto de código abierto que se lanzó en 2013, que permite automatizar la ejecución de aplicaciones dentro de contenedores y su seguimiento.\n\n**¿Qué es un contenedor?** \nUn contenedor empaqueta de forma ligera todo lo necesario para que un servicio pueda funcionar (librerías, código, dependencias), y además permite asegurar que el funcionamiento del servicio se produzca de la misma forma en cualquier lugar.\n\n**Diferencia con las Máquinas Virtuales** \nLas máquinas virtuales emulan todo el hardware de un equipo y ejecutan un sistema operativo invitado completo. En cambio, los contenedores comparten el Kernel del sistema operativo anfitrión (host) y por lo tanto son ligeros, arrancan en pocos segundos y hacen un uso eficiente de los recursos.","mode":"slides","transition":"slide","autoplay":true,"interval":10},{"id":"xmwq6xzhek6rj","type":"text","title":"Comandos fundamentales","body":"**Docker run**\nDescarga (si no existe localmente) y ejecuta una imagen dentro de un contenedor.\n\n**Docker ps**\n Lista los contenedores en ejecución. Con la opción -a muestra todos (activos e inactivos) y con -q solo sus IDs.\n\n**Docker images**\nMuestra las imágenes descargadas.\n\n**Docker exec**\nEjecuta comandos directamente dentro de un contenedor que se encuentra activo.\n\n**Docker logs**\nMuestra la salida estándar y los registros de eventos de un contenedor.\n\n**Docker inspect**\nMuestra la información de configuración detallada de un contenedor o imagen.","mode":"accordion","transition":"slide","autoplay":false,"interval":6}]},{"id":"t2","title":"Criptografía","icon":"🔑","summary":"","parent":null,"transition":"up","blocks":[{"id":"xmwq4qfgaijrw","type":"text","title":"","body":"En este segundo tema del curso, hemos dado un paso más allá de los conceptos básicos para adentrarnos en las herramientas reales que utilizan los profesionales de la ciberseguridad. Hemos aprendido a auditar sistemas, a transformar y ocultar datos, a cifrar nuestras comunicaciones y a comprender cómo la tecnología Blockchain garantiza la integridad de la información. ","mode":"normal","transition":"slide","autoplay":false,"interval":6}]},{"id":"xmwq73auq1fhy","title":"Actividades","icon":"💡","summary":"","parent":"t1b","transition":"slide","blocks":[{"id":"xmwq74vbv1r7p","type":"images","title":"Actividad 1: Primeros Contenedores ","layout":"carousel","cols":3,"transition":"flip","autoplay":true,"interval":6,"items":[{"id":"xmwq7b26cokjk","src":"media/asset_001.png","caption":"Ejecuté el contenedor de prueba lanzando sudo docker run hello-world "},{"id":"xmwq7dkej5tka","src":"media/asset_002.png","caption":"Verifiqué los contenedores activos en el sistema mediante sudo docker ps. "},{"id":"xmwq7f5u36ynm","src":"media/asset_003.png","caption":"Visualicé la totalidad de los contenedores (incluyendo los detenidos) con sudo docker ps -a."},{"id":"xmwq7fzoaikdd","src":"media/asset_004.png","caption":"Inspeccioné las imágenes descargadas en local mediante sudo docker images."}]},{"id":"xmwq7gnvowlm4","type":"images","title":"Actividad 2: Contenedores Interactivos","layout":"carousel","cols":5,"transition":"flip","autoplay":true,"interval":6,"items":[{"id":"xmwq7ihj74b6r","src":"media/asset_005.png","caption":"Creé un contenedor interactivo llamado fedora2 ejecutando docker run --name fedora2 -it fedora. ld."},{"id":"xmwq7jfyywr1o","src":"media/asset_006.png","caption":"Ejecuté un comando Linux para comprobar la fecha desde el exterior mediante sudo docker exec fedora2 date."},{"id":"xmwq7kixqvx2t","src":"media/asset_007.png","caption":"Desde otra ventana de terminal, verifiqué que el contenedor continuaba activo con sudo docker ps."},{"id":"xmwq7mdlz0i2e","src":"media/asset_008.png","caption":"Realicé un exit del contenedor interactivo y comprobé que se había detenido."},{"id":"xmwq7oh7beg6g","src":"media/asset_009.png","caption":"Volví a arrancarlo con sudo docker start fedora2 y posteriormente lo detuve desde otra terminal con sudo docker stop fedora2."}]},{"id":"xmwq7prakmv2h","type":"images","title":"Actividad 3: Contenedores en Background  ","layout":"carousel","cols":3,"transition":"flip","autoplay":true,"interval":6,"items":[{"id":"xmwq7qmxunors","src":"media/asset_010.png","caption":"Creé un contenedor web de Apache en segundo plano llamado apache100 ejecutando sudo docker run --name apache100 -d httpd."},{"id":"xmwq7sjfymykx","src":"media/asset_011.png","caption":"Verifiqué que la imagen httpd se descargó y que el contenedor permanecía activo mediante sudo docker images y sudo docker ps."},{"id":"xmwq7tspp2cqm","src":"media/asset_012.png","caption":"Desplegué un sistema operativo Ubuntu en background combinando los parámetros -d y -it mediante sudo docker run --name ubuntu5 -d -it ubuntu."},{"id":"xmwq7v2o3vywd","src":"media/asset_013.png","caption":"Confirmé con sudo docker ps que ambos contenedores (apache100 y ubuntu5) continuaban en ejecución."}]},{"id":"xmwq7whq14w2k","type":"text","title":"Actividad 4: Gestión Avanzada","body":"Desplegué un contenedor Nginx (nginx2), ejecuté comandos remotos con sudo docker exec nginx2 ls / y borré el contenedor tras pararlo.","mode":"normal","transition":"slide","autoplay":false,"interval":6},{"id":"xmwq7wqvjyihj","type":"images","title":"","layout":"mosaic","cols":2,"transition":"slide","autoplay":false,"interval":6,"items":[{"id":"xmwq7xgtm21mz","src":"media/asset_014.png","caption":""},{"id":"xmwq7yx5hctqz","src":"media/asset_015.png","caption":""},{"id":"xmwq7zk208iar","src":"media/asset_016.png","caption":""},{"id":"xmwq80o8b8tqi","src":"media/asset_017.png","caption":""}]},{"id":"xmwq81tmbyt7m","type":"images","title":"","layout":"carousel","cols":3,"transition":"flip","autoplay":true,"interval":6,"items":[{"id":"xmwq82g5ao4f4","src":"media/asset_018.jpg","caption":"Creé el contenedor nginx10, accedí con exec -it bash, instalé wget y generé tráfico contra localhost. \nVisualicé las peticiones HTTP registradas ejecutando sudo docker logs nginx10."},{"id":"xmwq83a04edxu","src":"media/asset_019.png","caption":"Analicé los procesos internos y simulé uno con sleep 500 comprobándolo mediante sudo docker top nginx10."}]},{"id":"xmwq84v5w6r1v","type":"text","title":"","body":"Revisé el consumo de CPU y memoria con sudo docker stats nginx10 y forcé su cierre con sudo docker kill nginx10.","mode":"normal","transition":"slide","autoplay":false,"interval":6},{"id":"xmwq854p7b737","type":"images","title":"","layout":"mosaic","cols":2,"transition":"slide","autoplay":false,"interval":6,"items":[{"id":"xmwq86215w5ka","src":"media/asset_020.png","caption":""},{"id":"xmwq86ql2f90m","src":"media/asset_021.png","caption":""}]},{"id":"xmwq87die065x","type":"text","title":"","body":"Descargué la imagen de Node.js (node), ejecuté sudo docker inspect nodejs y filtré la versión con grep NODE_VERSION.","mode":"normal","transition":"slide","autoplay":false,"interval":6},{"id":"xmwq87m8mdmer","type":"images","title":"","layout":"mosaic","cols":2,"transition":"slide","autoplay":false,"interval":6,"items":[{"id":"xmwq88af0gvdu","src":"media/asset_022.png","caption":""},{"id":"xmwq88yjapmzd","src":"media/asset_023.png","caption":""}]},{"id":"xmwq899vuk0o9","type":"images","title":"","layout":"mosaic","cols":3,"transition":"slide","autoplay":false,"interval":6,"items":[{"id":"xmwq8a0sqeq4j","src":"media/asset_024.png","caption":"Copié un archivo desde el host hacia un contenedor ejecutando sudo docker cp UwU ubuntu5:/tmp."}]},{"id":"xmwq8am39o54w","type":"images","title":"Actividad 5: Configuración de Contenedores mediante Variables de Entorno ","layout":"carousel","cols":3,"transition":"flip","autoplay":true,"interval":6,"items":[{"id":"xmwq8bnij4xwz","src":"media/asset_025.png","caption":"Descargué la imagen oficial de PostgreSQL desde el registro mediante sudo docker pull postgres."},{"id":"xmwq8cb28jp61","src":"media/asset_026.png","caption":"Verifiqué que la imagen estaba disponible localmente filtrando con sudo docker images | grep postgres."},{"id":"xmwq8dgzue0nr","src":"media/asset_027.png","caption":"Desplegué el contenedor postgres1 configurando las credenciales necesarias: sudo docker run --name postgres1 -e POSTGRES_PASSWORD=guaxinais -e POSTGRES_USER=usubd1 -e POSTGRES_DB=pt1 postgres."},{"id":"xmwq8ebrrnd3l","src":"media/asset_028.png","caption":"Accedí a la terminal interna del contenedor mediante sudo docker exec -it postgres1 bash."},{"id":"xmwq8fccfyxh8","src":"media/asset_029.png","caption":"Me conecté al cliente de base de datos ejecutando psql -U usubd1 pt1."},{"id":"xmwq8g9vi7lib","src":"media/asset_030.png","caption":"Comprobé la existencia de la base de datos pt1 con el comando \\l y me desconecté."}]}],"iconAuto":true},{"id":"xmwq8k0cg6fq1","title":"Lynis","icon":"🔬","summary":"","parent":"t2","transition":"up","blocks":[{"id":"xmwq8k0cg8ggy","type":"text","title":"¿Qué es Lynis?","body":"Lynis es una herramienta de auditoría de seguridad para sistemas basados en Unix/Linux. En lugar de ser un simple antivirus, funciona como un inspector de calidad: analiza la configuración de nuestro sistema operativo y nos dice exactamente qué puertas hemos dejado abiertas. \n\nLynis escanea miles de archivos de configuración, permisos y servicios en el sistema (como el núcleo, la red o los usuarios) buscando malas prácticas. No soluciona los problemas por sí solo; en su lugar, genera un informe con un código de colores. Por ejemplo, si nuestro servidor DNS no responde, Lynis no lo repara, pero lanza un Warning (advertencia en rojo) detallando el código del error (ej. NETW-2704) para que el administrador intervenga. \n","mode":"reveal","transition":"up","autoplay":true,"interval":6},{"id":"xmwq8m2a98865","type":"text","title":"Conceptos clave","body":"**Hardening (Bastionado)** \nProceso de asegurar un sistema reduciendo sus vulnerabilidades al mínimo (cerrar puertos, desinstalar software innecesario).\n\n**Warning** \nAdvertencia crítica de seguridad en Lynis que requiere atención inmediata.\n\n**Suggestion**\n Recomendación para mejorar la postura de seguridad (ej. instalar fail2ban para evitar ataques de fuerza bruta). ","mode":"accordion","transition":"slide","autoplay":false,"interval":6}],"iconAuto":true},{"id":"xmwq8oygda6c4","title":"Actividad 1: Auditoría de Sistemas con Lynis ","icon":"🔎","summary":"","parent":"xmwq8k0cg6fq1","transition":"slide","blocks":[{"id":"xmwq8r28tkfhz","type":"images","title":"Desarrollo","layout":"mosaic","cols":3,"transition":"slide","autoplay":false,"interval":6,"items":[{"id":"xmwq8rfj7m1mb","src":"media/asset_031.png","caption":"Lancé una auditoría completa del sistema con el comando sudo lynis audit system. "}]},{"id":"xmwq8s0t7pseb","type":"text","title":"","body":"Dejé que el escáner analizara los diferentes módulos (sistema de ficheros, red, servicios, kernel). \nPor ejemplo, al final del escaneo nos muestra las advertencias y las sugerencias; en este caso sólo hay un Warning, el cual vimos anteriormente; debajo de la advertencia nos muestra las sugerencias que nos hace, se podría decir que en su mayoría recomienda instalar algunas cosas que podría necesitar el sistema. ","mode":"normal","transition":"slide","autoplay":false,"interval":6},{"id":"xmwq8t22xpsqm","type":"images","title":"","layout":"mosaic","cols":3,"transition":"slide","autoplay":false,"interval":6,"items":[{"id":"xmwq8ti5sw0bj","src":"media/asset_032.png","caption":""}]},{"id":"xmwq8tvpotrli","type":"images","title":"","layout":"mosaic","cols":3,"transition":"slide","autoplay":false,"interval":6,"items":[{"id":"xmwq8ujms1jl9","src":"media/asset_033.png","caption":"Respondí las preguntas técnicas sobre configuraciones como /etc/sudoers"}]},{"id":"xmwq8uy9hffqy","type":"text","title":"Resultado obtenido","body":"El análisis finalizó arrojando 1 Warning (relacionado con un servidor DNS que no respondía) y 49 Suggestions de mejora. Comprobé cómo el sistema nos guía para instalar herramientas adicionales que protegen contra ataques, como el bloqueo de IPs tras intentos fallidos.","mode":"normal","transition":"slide","autoplay":false,"interval":6}],"iconAuto":true},{"id":"xmwq8w2xjcprt","title":"CyberChef","icon":"🗂️","summary":"","parent":"t2","transition":"up","blocks":[{"id":"xmwq8w2xj7ngv","type":"text","title":"La \"Navaja Suiza\" de la Ciberseguridad","body":"CyberChef es una potente aplicación web desarrollada por la inteligencia británica que permite realizar operaciones complejas con datos de forma visual. Es como jugar con bloques de construcción para codificar, decodificar, cifrar o analizar información sospechosa.\n\nA diferencia del cifrado, que requiere una clave, la codificación solo cambia el formato de los datos para que puedan viajar por redes. CyberChef utiliza \"Recetas\" (Recipes). Por ejemplo, los atacantes suelen ofuscar (esconder) sus scripts maliciosos codificándolos en formato Hexadecimal o Base64. Con CyberChef, arrastramos el bloque \"From Base64\" y mágicamente el texto incomprensible se convierte en código legible. \n","mode":"normal","transition":"slide","autoplay":false,"interval":6},{"id":"xmwq8x9aoaf8t","type":"text","title":"Conceptos clave","body":"**Codificación (Encoding)** \nTransformación de datos a otro formato público (como Base64). No aporta seguridad, solo compatibilidad.\n\n**Receta (Recipe)** \nConjunto de operaciones secuenciales que aplicamos a un bloque de datos en CyberChef para transformarlo.\n\n**Ofuscación**\nTécnica de modificar un código para que sea muy difícil de leer por humanos o antivirus, manteniendo su funcionamiento.","mode":"accordion","transition":"slide","autoplay":false,"interval":6}],"iconAuto":true},{"id":"xmwq8ymfj3wma","title":"Actividades","icon":"📊","summary":"","parent":"xmwq8w2xjcprt","transition":"up","blocks":[{"id":"xmwq8ymfj4mtc","type":"text","title":"Actividad 2: Análisis y Transformación de Datos con CyberChef ","body":"","mode":"normal","transition":"slide","autoplay":false,"interval":6},{"id":"xmwq903cedxiy","type":"text","title":"Desarrollo","body":"1.- Accedí a la interfaz web de la herramienta CyberChef.\n\n2.- Fui analizando uno por uno los textos ofuscados propuestos en la práctica para intentar deducir qué algoritmo clásico o codificación se había utilizado.\n\n3.- En el panel lateral, busqué y arrastré distintas operaciones al panel de trabajo, tales como ROT13 (para el cifrado César clásico) o Vigenère Decode dependiendo del ejercicio.\n\n4.- Fui ajustando los parámetros (como el número de rotaciones o la clave secreta en Vigenère) hasta que el texto original y legible apareció correctamente en la caja de Output.","mode":"normal","transition":"slide","autoplay":false,"interval":6},{"id":"xmwq919595cdl","type":"images","title":"","layout":"mosaic","cols":3,"transition":"slide","autoplay":false,"interval":6,"items":[{"id":"xmwq91ylh9ol5","src":"media/asset_034.png","caption":""}]},{"id":"xmwq92837c6yn","type":"text","title":"Resultado obtenido:","body":"Logré revertir con éxito todos los textos cifrados de la práctica. Al aplicar secuencialmente los formatos y claves correctas en CyberChef, los mensajes, que inicialmente parecían cadenas de texto aleatorias, se tradujeron a mensajes legibles en texto plano.","mode":"normal","transition":"slide","autoplay":false,"interval":6}],"iconAuto":true},{"id":"xmwq93sfygpu6","title":"Criptografía","icon":"🔐","summary":"","parent":"t2","transition":"up","blocks":[{"id":"xmwq93sfynydt","type":"text","title":"","body":"GPG (GNU Privacy Guard) es un software de cifrado que nos permite comunicarnos de forma 100% segura por canales inseguros (como internet). Utiliza criptografía asimétrica, lo que significa que ya no tenemos que compartir la misma contraseña en secreto para enviarnos un archivo privado. ","mode":"normal","transition":"slide","autoplay":false,"interval":6},{"id":"xmwq94aajr1sw","type":"text","title":"","body":"En la criptografía asimétrica, cada usuario tiene dos claves matemáticamente enlazadas:\n\n-La Clave Pública se reparte a todo el mundo (como si fuera un buzón abierto).\n\n-La Clave Privada se guarda bajo contraseña y NUNCA se comparte (es la única llave del buzón). Ejemplo: Si quiero enviarle un documento secreto a mi profesor, lo cifro con la clave pública del profesor. Una vez cifrado, solo la clave privada del profesor podrá abrirlo. Ni siquiera yo, que lo he cifrado, podría volver a leerlo sin su clave privada.","mode":"slides","transition":"slide","autoplay":false,"interval":6},{"id":"xmwq95s2iqxfz","type":"text","title":"Conceptos clave","body":"**Clave Pública** \nLlave que compartes con el mundo para que puedan enviarte mensajes cifrados.\n\n**Clave Privada**\n Llave secreta y personal. Es la única capaz de descifrar lo que se cifró con tu clave pública.\n\n**Firma Digital** \nProceso inverso (cifrar un hash con tu clave privada) que demuestra al receptor que el mensaje realmente lo enviaste tú y no ha sido modificado.","mode":"accordion","transition":"slide","autoplay":false,"interval":6}],"iconAuto":true},{"id":"xmwq975uw3173","title":"Actividades","icon":"🧭","summary":"","parent":"xmwq93sfygpu6","transition":"up","blocks":[{"id":"xmwq97n21yzce","type":"images","title":"Actividad 3: Criptografía Asimétrica con GPG","layout":"carousel","cols":3,"transition":"slide","autoplay":true,"interval":6,"items":[{"id":"xmwq989tqcvvb","src":"media/asset_035.png","caption":"Utilicé una contraseña acordada para cifrar simétricamente el archivo original mediante el comando gpg -c."},{"id":"xmwq9980fsxth","src":"media/asset_036.png","caption":"Utilicé el comando diff para inspeccionar las diferencias binarias entre el contenido original y el archivo transformado."},{"id":"xmwq9asuqocku","src":"media/asset_037.png","caption":"Procedí a descifrar el archivo cifrado redireccionando el contenido a un nuevo fichero de salida sin borrar el anterior mediante gpg -d e introduciendo la clave de paso"}]}],"iconAuto":true},{"id":"xmwq9bgf7kjeb","title":"Blockchain","icon":"🔧","summary":"","parent":"t2","transition":"up","blocks":[{"id":"xmwq9bgf7hqav","type":"text","title":"","body":"Mucho más allá del Bitcoin o las criptomonedas, la tecnología Blockchain (cadena de bloques) es una revolución en la integridad de los datos. Es una base de datos distribuida donde la información registrada no puede ser borrada ni alterada jamás sin que todo el mundo se dé cuenta.\n\nUn Bloque es simplemente un paquete de datos (por ejemplo, transacciones bancarias o historiales médicos). Cada bloque, una vez lleno, se sella utilizando una función matemática llamada Hash (una especie de huella digital única). El truco de la seguridad es que el Bloque 2 incluye en su interior la \"huella\" del Bloque 1. El Bloque 3 incluye la del Bloque 2, y así sucesivamente, creando una cadena. Si un atacante intenta modificar un solo dato del Bloque 1, su huella (Hash) cambia por completo, lo que rompe el Bloque 2 y todos los siguientes, alertando a toda la red del fraude. ","mode":"reveal","transition":"slide","autoplay":true,"interval":6},{"id":"xmwq9co6sy1wl","type":"text","title":"Conceptos clave","body":"**Bloque (Block)** \nAgrupación de datos validados que se sella criptográficamente.\n\n**Hash (Huella digital)** \nCódigo alfanumérico único generado a partir de unos datos. Si cambias una sola coma del texto, el Hash cambia drásticamente.\n\n**Descentralización** \nNo hay un servidor central (como un banco o Facebook). La base de datos es mantenida por miles de ordenadores (nodos) simultáneamente.","mode":"accordion","transition":"slide","autoplay":false,"interval":6}],"iconAuto":true},{"id":"xmwq9dwvlt1xu","title":"Actividad 4: Blockchain","icon":"🧰","summary":"","parent":"xmwq9bgf7kjeb","transition":"up","blocks":[{"id":"xmwq9ezasequq","type":"text","title":"Sesión 1: Rompe la Cadena","body":"**Hash** \nCambié una letra en un texto y verifiqué cuántos caracteres del hash resultante cambiaron (56 de 64 caracteres).\n\n**Minado y Dificultad** \nCambié los datos de un bloque y ejecuté el minado ajustando el selector de dificultad a 3, 4 y 5 ceros, registrando los intentos necesarios (799, 62.074 y 800.122 intentos respectivamente). \n\n**La Cadena** \nAlteré una cantidad en el Bloque 2 (cambiando 4 € por 400 €) y observé cómo el Bloque 2 y todos los posteriores se marcaron en rojo. Re-miné los bloques en orden secuencial (Bloque 1 y luego Bloque 2) para restaurar la validez de la cadena. \n\n**Red Distribuida** \nSimulé el botón \"Beto hace trampa\". Beto re-minó su cadena en solitario, pero su versión fue rechazada por la red al no coincidir con la mayoría (Ana y Carla). Posteriormente, simulé una alteración simultánea en dos de tres copias (ataque del 51%) para observar cómo la mayoría impone su versión. \n\n**Firmas** \nGeneré mi par de claves, copié los primeros 10 caracteres de mi clave pública, firmé un mensaje y alteré el importe del mensaje recibido para observar la respuesta del verificador.","mode":"reveal","transition":"up","autoplay":true,"interval":6},{"id":"xmwq9hmgk1nfv","type":"images","title":"","layout":"mosaic","cols":3,"transition":"slide","autoplay":false,"interval":6,"items":[{"id":"xmwq9i64l9wrr","src":"media/asset_038.png","caption":""}]},{"id":"xmwq9ic2ep5qn","type":"text","title":"Actividad 5: Blockchain","body":"","mode":"normal","transition":"slide","autoplay":false,"interval":6},{"id":"xmwq9jascs1c4","type":"text","title":"Sesión 2: AulaCoin","body":"**Monedero** \nCreé mi monedero bajo la dirección AC-DF7C4CB249 utilizando claves generadas bajo la curva criptográfica de Bitcoin.\n\n**Minar** \nActivé el proceso de minado y registré el aumento de la potencia (de 1.27 H/s a 800 H/s) y la dificultad de la red al incrementar los hilos de CPU. \n\n**Pagar a un compañero** \nRealicé un envío de monedas a otro monedero de la clase y comprobé su paso por la mempool antes de ser confirmado en un bloque. \n\n**Retos Hacker** \nEjecuté propositivamente 5 ataques (gastar saldo inexistente, gastar monedas de otro, cambiar un pago firmado, repetir un pago y doble gasto) anotando el motivo de rechazo que dio la red.\n \n**Demostración del Profesor** \nObservé en la pantalla del proyector cómo la cadena entera detectó la manipulación de un bloque antiguo por parte del profesor.","mode":"reveal","transition":"up","autoplay":true,"interval":6},{"id":"xmwq9lr2qb2dv","type":"images","title":"","layout":"collage","cols":3,"transition":"slide","autoplay":false,"interval":6,"items":[{"id":"xmwq9maybjpm1","src":"media/asset_039.png","caption":""},{"id":"xmwq9mwfwo67m","src":"media/asset_040.png","caption":""},{"id":"xmwq9nki6jr4r","src":"media/asset_041.png","caption":""},{"id":"xmwq9o82ow22y","src":"media/asset_042.png","caption":""}]}],"iconAuto":true},{"id":"xmwq9pe6t7gel","title":"Seguridad Pasiva: Equipos","icon":"🛡️","summary":"","parent":null,"transition":"up","blocks":[{"id":"xmwq9pe6t1jl7","type":"text","title":"","body":"Imagínate que tienes los servidores de Google o del banco en una mesa de plástico al lado de un ventanal por donde entra todo el sol de la tarde y con un vaso de café al lado. Un desastre a punto de ocurrir, ¿verdad?\n\nLa seguridad pasiva trata precisamente de evitar esas catástrofes y de estar preparados para cuando todo lo demás falla. En este tema estudiamos las fortalezas donde habitan los servidores: los Centros de Proceso de Datos (CPD). Aprendemos a diseñar salas blindadas contra incendios, apagones, olas de calor e intrusos.","mode":"cards","transition":"slide","autoplay":false,"interval":6},{"id":"xmwq9qeyuvxl5","type":"text","title":"Conceptos Clave","body":"**CPD (Data Center)** \nLa sala o edificio blindado donde se centralizan los servidores y sistemas de red de una empresa.\n\n**Pasillo Frío / Pasillo Caliente** \nTécnica de organización de racks donde las máquinas absorben aire frío por delante (pasillo frío) y expulsan el aire caliente por detrás (pasillo caliente).\n\n**SAI / UPS** \nSistema de baterías que mantiene alimentados los equipos cuando se corta la luz eléctrica.\n\n**Centro de Respaldo (CR)** \nUn segundo CPD réplica, situado a kilómetros de distancia, listo para tomar el control si el principal se destruye o cae.","mode":"accordion","transition":"slide","autoplay":false,"interval":6},{"id":"xmwq9s0u73nd5","type":"text","title":"El CPD y su ubicación","body":"El CPD es el corazón digital de la empresa. Centralizar los servidores en una sola sala fría ahorra dinero en mantenimiento, vigilancia y cableado.\n","mode":"normal","transition":"slide","autoplay":false,"interval":6},{"id":"xmwq9szgx9zbn","type":"text","title":"Ubicación ideal","body":"**Plantas bajas** \nExpuestas a inundaciones y asaltos o sabotajes desde la calle.\n\n**Últimas plantas** \nExpuestas a goteras, accidentes aéreos y al calor de los incendios de pisos inferiores.\n\n**Plantas intermedias** \nLa zona \"Ricitos de Oro\", la más segura de un edificio.\n\n**Entorno** \nLejos de ríos, costas, aeropuertos, bases militares o empresas que manejen productos peligrosos.","mode":"cards","transition":"slide","autoplay":false,"interval":6},{"id":"xmwq9upbknpj3","type":"text","title":"Protección y aislamiento","body":"**Temperatura y Humedad** \nLos procesadores son verdaderas estufas. La humedad alta crea cortocircuitos; la humedad muy baja genera electricidad estática.\n\n**Interferencias electromagnéticas** \nHay que alejar el CPD de generadores gigantes o maquinaria industrial que puedan corromper las señales.\n\n**Ruido y paredes** \nCentenares de ventiladores girando a máxima velocidad generan un ruido ensordecedor. Se usan paredes ignífugas con pintura plástica para evitar el polvo y paredes de hormigón en CPDs de alta seguridad.","mode":"cards","transition":"slide","autoplay":false,"interval":6},{"id":"xmwq9vvs5x1j7","type":"text","title":"Ventilación y climatización","body":"**Sin ventanas** \nUn CPD no tiene ventanas por seguridad y porque se necesita aire acondicionado comercial continuo.\n\n**El truco del Falso Suelo** \nEl aire frío viaja por debajo del suelo técnico y sale disparado por baldosas perforadas hacia el frontal de los servidores.\n\n**Pasillos fríos y calientes** \nLos racks se colocan cara a cara (absorben aire frío del pasillo frío) y espalda con espalda (expulsan el calor al pasillo caliente) para maximizar la eficiencia.","mode":"cards","transition":"slide","autoplay":false,"interval":6},{"id":"xmwq9wxwws6jh","type":"text","title":"Suministro eléctrico y comunicaciones","body":"**Doble todo (Redundancia)** \nEl CPD debe contratar electricidad con dos compañías diferentes y recibir fibra óptica por rutas físicas distintas (por si una excavadora rompe un cable en la calle).\n\n**Generadores de emergencia** \nSi se va la luz de toda la ciudad, entran en acción grandes motores diésel (grupos electrógenos) para mantener el CPD vivo durante días.","mode":"cards","transition":"slide","autoplay":false,"interval":6},{"id":"xmwq9xx1rf8lv","type":"text","title":"Control de acceso y vigilancia","body":"**Nadie entra \"a dar una vuelta\"** \nSolo el personal autorizado accede a la pecera.\n\n**Cerraduras inteligentes** \nTarjetas RFID con horarios reducidos, llaves iButton (\"Touch Memories\") y videovigilancia IP.\n\n**Biometría** \nLectores de huella dactilar, geometría de la mano o escáner de iris para las zonas más críticas.","mode":"cards","transition":"slide","autoplay":false,"interval":6},{"id":"xmwq9z6duxf0w","type":"text","title":"Centro de respaldo (CR)","body":"**El plan de emergencia total** \n¿Y si un terremoto o incendio destruye el CPD principal? La empresa se arruina si no tiene un Centro de Respaldo.\n\n**Sincronización** \nEl CR está a kilómetros de distancia y recibe réplicas constantes de los datos. Si el principal cae, los usuarios son conmutados automáticamente al CR sin enterarse del cambio.","mode":"normal","transition":"slide","autoplay":false,"interval":6},{"id":"xmwqa064bbt5k","type":"text","title":"SAI o UPS (Sistemas de Alimentación Ininterrumpida)","body":"El salvavidas eléctrico: Baterías interactivas entre la red eléctrica y el servidor.\n\n**Tipos de SAI:**\n**Off-line / Stand-by** \nVigilante en la sombra. Si se va la luz, conmuta a batería en milisegundos. Usado en PCs normales.\n**On-line** \nLos servidores se alimentan siempre directamente de las baterías del SAI, que se cargan a la vez de la red. Cero tiempo de conmutación y protección total contra picos de tensión.","mode":"cards","transition":"slide","autoplay":false,"interval":6},{"id":"xmwqa25fifb0i","type":"text","title":"Monitorización y mantenimiento","body":"**Alertas automatizadas** \nEl software del SAI envía avisos por correo o SMS a los administradores si baja la batería o falla la luz.\n\n**Triggers** \nSe programa para que, si quedan solo 5 minutos de batería, mande la orden a los servidores para apagarse ordenadamente y sin perder información","mode":"cards","transition":"slide","autoplay":false,"interval":6}],"iconAuto":true},{"id":"xmwqa3jyww0iq","title":"Seguridad Pasiva: Almacenamiento","icon":"🛡️","summary":"","parent":null,"transition":"up","blocks":[{"id":"xmwqa3jywoeof","type":"text","title":"","body":"El hardware estropeado se reemplaza comprando uno nuevo en la tienda, pero los datos perdidos de una empresa no se recuperan con dinero.\n\nEn este cuarto tema exploramos las tecnologías para almacenar la información de forma segura, rápida y resistente a fallos de discos duros. Aprenderemos a combinar discos en arrays RAID, montar sistemas de red (NAS/SAN) y organizar copias de seguridad a prueba de desastres.","mode":"normal","transition":"slide","autoplay":false,"interval":6},{"id":"xmwqa4gclinc7","type":"text","title":"Conceptos Clave","body":"**Tolerancia a fallos** \nCapacidad de un sistema de seguir funcionando aunque falle un componente físico (como la rotura de un disco duro).\n\n**RAID** \nRedundant Array of Independent Disks. Agrupación de varios discos físicos para que el sistema operativo los vea como una sola unidad.\n\n**NAS / SAN** \nSoluciones para guardar archivos o volúmenes de disco a través de la red local o redes de fibra dedicadas.\n\n**Estrategia de Backup 3-2-1** \nGuardar 3 copias de los datos, en 2 soportes distintos, y 1 fuera del edificio.","mode":"accordion","transition":"slide","autoplay":false,"interval":6},{"id":"xmwqa7i30shno","type":"text","title":"Estrategias de almacenamiento","body":"**El activo más valioso** \nLos datos de clientes, facturas y código fuente son insustituibles.\n\n**Los tres pilares del almacenamiento**\n**Rendimiento** \nQué tan rápido leemos y escribimos.\n**Disponibilidad** \nQue la información esté lista cuando se necesite.\n**Accesibilidad** \nQue las personas autorizadas lleguen a los archivos sin problemas.","mode":"cards","transition":"slide","autoplay":false,"interval":6},{"id":"xmwqa9l74mhgy","type":"images","title":"RAID (Tolerancia a fallos y Rendimiento)","layout":"mosaic","cols":3,"transition":"slide","autoplay":false,"interval":6,"items":[{"id":"xmwqaads4my1h","src":"media/asset_043.png","caption":""}]},{"id":"xmwqaalztlthn","type":"text","title":"RAID en Windows","body":"**RAID por software** \nWindows permite crear volúmenes distribuidos (RAID 0), reflejados (RAID 1) o RAID 5 sin necesidad de comprar una tarjeta controladora cara.\n\n**Procedimiento** \nDesde la herramienta Administración de discos (diskmgmt.msc), se convierten los discos a Dinámicos, se seleccionan las unidades y se crea el volumen deseado.","mode":"reveal","transition":"up","autoplay":true,"interval":6},{"id":"xmwqabg6sctl6","type":"text","title":"NAS, SAN y Clústeres","body":"**NAS (Network Attached Storage)** \nEs una \"caja de discos con red\" conectada por Ethernet. Entrega archivos a los usuarios (protocolos SMB/NFS).\n\n**SAN (Storage Area Network)** \nUna red ultrarrápida (normalmente de Fibra) dedicada únicamente a conectar servidores con cabinas de discos. Entrega bloques de disco puros.\n\n**Clústeres** \nGrupo de servidores trabajando juntos. Si uno muere, otro toma su lugar en segundos.","mode":"reveal","transition":"up","autoplay":true,"interval":6},{"id":"xmwqacseffyyr","type":"text","title":"Almacenamiento en la nube y P2P","body":"**La Nube (Cloud)** \nGuardar los datos en la infraestructura de proveedores como Google, AWS o Microsoft. \n      -Ventaja: Accesibilidad total y coste inicial bajo. \n      -Inconveniente: Dependencia de la conexión a internet y privacidad.\n\n**Redes P2P** \nRedes descentralizadas donde todos los nodos comparten trozos de archivos entre sí (sin servidor central).","mode":"slides","transition":"slide","autoplay":false,"interval":6},{"id":"xmwqaf203fwao","type":"text","title":"Copias de seguridad (Backups)","body":"Tipos de copia:\n**Completa** \nCopia absoluta de todos los archivos. Tarda mucho y ocupa mucho espacio.\n**Incremental** \nSolo copia lo que ha cambiado desde la última copia (sea esta completa o incremental). Rápida de hacer, lenta de restaurar.\n**Diferencial** \nCopia lo que ha cambiado desde la última copia completa. Ocupa más espacio pero se restaura rápido.","mode":"cards","transition":"slide","autoplay":false,"interval":6},{"id":"xmwqajimmwe9v","type":"text","title":"Imagen del sistema y puntos de restauración","body":"**Backup de datos vs. Imagen del sistema** \nEl backup guarda tus fotos o documentos; la imagen del sistema hace una \"fotografía\" exacta de todo el SO, programas, drivers y configuraciones.\n\n**LiveCD / USB de rescate** \nEntorno de arranque independiente para restaurar una imagen o arreglar el sistema si el SO no arranca.\n\n**Congelación (Deep Freeze)** \nMantiene el disco inmune a cambios. Al reiniciar, cualquier programa instalado o virus desaparece.\n\n**Puntos de restauración** \nCapturas de configuración del registro de Windows antes de instalar drivers o actualizaciones.","mode":"cards","transition":"slide","autoplay":false,"interval":6},{"id":"xmwqakvfxjr6m","type":"text","title":"Optimización de discos (HDD vs. SSD)","body":"**Discos Mecánicos (HDD)** \nLos archivos se fragmentan con el uso en las agujas lectoras. Se requiere Desfragmentación periódica para reordenar las piezas contiguas.\n\n**Discos de Estado Sólido (SSD)** \nNo tienen piezas mecánicas. NUNCA hay que desfragmentarlos (reduce drásticamente su vida útil). Se aplica la orden TRIM para liberar bloques limpios.","mode":"reveal","transition":"up","autoplay":true,"interval":6}],"iconAuto":true},{"id":"xmwqam5f1ywxn","title":"Extras","icon":"🛡️","summary":"","parent":null,"transition":"up","blocks":[{"id":"xmwqam5f1vs5f","type":"text","title":"NAS","body":"Durante una visita realizada en el instituto, tuvimos la oportunidad de conocer una sala en la que se encontraba instalado un dispositivo NAS de 12 bahías. El profesor nos indicó que debíamos incluir este equipo en nuestro portafolio, ya que está relacionado con los sistemas de almacenamiento y la seguridad pasiva estudiados en este tema.\n\nAunque durante la visita no estaba permitido utilizar teléfonos móviles, por lo que no pudimos realizar fotografías ni registrar los datos técnicos del dispositivo, la observación nos permitió conocer un ejemplo real de un sistema de almacenamiento conectado a una red.","mode":"normal","transition":"slide","autoplay":false,"interval":6},{"id":"xmwqamt1eui2e","type":"text","title":"¿Qué es un NAS?","body":"NAS son las siglas de Network Attached Storage, que significa almacenamiento conectado a la red. Es un dispositivo diseñado para almacenar y compartir archivos mediante una conexión de red, permitiendo que diferentes usuarios y equipos accedan a la información según los permisos establecidos.\n\nA diferencia de un disco duro externo conectado directamente a un ordenador, un NAS funciona como un sistema de almacenamiento independiente dentro de la red. Puede utilizarse para guardar documentos, copias de seguridad, archivos multimedia y otros datos importantes de una organización.","mode":"cards","transition":"slide","autoplay":false,"interval":6},{"id":"xmwqanae98p65","type":"images","title":"","layout":"mosaic","cols":3,"transition":"slide","autoplay":false,"interval":6,"items":[{"id":"xmwqany6fje12","src":"media/asset_044.png","caption":""}]},{"id":"xmwqao3noxty6","type":"text","title":"Funcionamiento general","body":"Un NAS se conecta a la infraestructura de red, normalmente mediante un cable Ethernet conectado a un switch o a otro dispositivo de red.\n\nUna vez configurado, los usuarios autorizados pueden acceder a las carpetas compartidas desde sus ordenadores. El administrador puede gestionar las cuentas de usuario, los permisos de acceso y la organización de los archivos.\n\nDe forma general, su funcionamiento comprende:\n-Instalación de unidades de almacenamiento compatibles.\n-Configuración de los discos y, si el dispositivo lo permite, de un sistema RAID.\n-Creación de volúmenes y carpetas compartidas.\n-Configuración de usuarios y permisos.\n-Conexión del NAS a la red local.\n-Acceso a los datos desde los equipos autorizados.","mode":"reveal","transition":"up","autoplay":false,"interval":6},{"id":"xmwqap6hbk9bd","type":"text","title":"Relación con los sistemas RAID","body":"Un NAS con varias bahías puede permitir el uso de configuraciones RAID para combinar diferentes discos y mejorar aspectos como el rendimiento o la tolerancia a fallos.\n\nAlgunos ejemplos son:\n-RAID 0: distribuye los datos entre varios discos para mejorar el rendimiento, pero no ofrece tolerancia a fallos.\n-RAID 1: duplica la información entre discos para mantener una copia redundante.\n-RAID 5: distribuye los datos y la paridad entre varios discos, permitiendo tolerar el fallo de una unidad.\n-RAID 6: utiliza doble paridad y puede tolerar el fallo simultáneo de dos discos.\n-RAID 10: combina distribución y duplicación de datos.\n\nTambién debemos recordar que RAID no sustituye a las copias de seguridad. Aunque puede ayudar a mantener la disponibilidad de los datos ante determinados fallos de discos, no protege por sí solo frente a borrados accidentales, malware, robos o daños físicos que afecten al dispositivo.","mode":"reveal","transition":"up","autoplay":false,"interval":6},{"id":"xmwqaqiznhud9","type":"text","title":"Importancia de la seguridad y el mantenimiento","body":"Al almacenar información de una organización, un NAS debe protegerse tanto física como lógicamente.\n\nEs importante controlar quién puede acceder al dispositivo, utilizar contraseñas seguras, mantener actualizado su software y establecer permisos adecuados para cada usuario.\n\nTambién conviene supervisar el estado de los discos, controlar la temperatura y la ventilación, proteger el equipo frente a interrupciones eléctricas y realizar copias de seguridad periódicas en otro soporte o ubicación","mode":"normal","transition":"slide","autoplay":false,"interval":6},{"id":"xmwqarpqg6h1t","type":"text","title":"Conclusión","body":"Esta visita me permitió comprender mejor cómo se aplican los sistemas de almacenamiento en un entorno real. Hasta ese momento, los NAS y sus diferentes posibilidades eran principalmente conceptos teóricos estudiados en clase.\n\nConocer un dispositivo de 12 bahías me ayudó a visualizar la importancia de disponer de sistemas capaces de centralizar grandes cantidades de información y facilitar el acceso a ella desde diferentes equipos.\n\nTambién comprendí que no basta con tener una gran capacidad de almacenamiento: es necesario proteger los datos, controlar el acceso, supervisar el estado del hardware y mantener una estrategia de copias de seguridad.\n\nEn conclusión, esta experiencia complementó los contenidos del tema y me permitió relacionar los conocimientos adquiridos en clase con el equipamiento que puede encontrarse en una infraestructura informática real.","mode":"normal","transition":"slide","autoplay":false,"interval":6},{"id":"xmwqasflkg4d9","type":"text","title":"Inteligencia artificial aplicada al reconocimiento de partituras musicales","body":"Durante una de las sesiones en el instituto recibimos la visita de Adrián Roselló Pedraza, estudiante e investigador de la Universidad de Alicante, quien nos presentó parte del trabajo de investigación que estaba desarrollando junto con su equipo en el ámbito de la inteligencia artificial.\n\nLa charla se centró en una aplicación bastante interesante de esta tecnología: conseguir que un sistema de inteligencia artificial sea capaz de interpretar partituras musicales a partir de imágenes digitalizadas y convertirlas en información que posteriormente pueda utilizarse para reproducir las composiciones.","mode":"normal","transition":"slide","autoplay":false,"interval":6},{"id":"xmwqasyk877ne","type":"text","title":"¿En qué consiste el proyecto?","body":"La investigación está relacionada con el reconocimiento óptico de música, conocido como OMR (Optical Music Recognition).\n\nEsta tecnología busca que un ordenador pueda interpretar automáticamente una partitura escaneada o fotografiada. Para ello, el sistema debe localizar los pentagramas, reconocer las notas musicales y distinguir otros símbolos, como silencios, claves, alteraciones y figuras rítmicas.\n\nUna vez identificados estos elementos, la información se transforma en un formato musical digital que puede procesarse mediante programas informáticos e incluso reproducirse utilizando herramientas de síntesis musical.","mode":"slides","transition":"flip","autoplay":true,"interval":10},{"id":"xmwqatww9g23m","type":"text","title":"El principal problema: las diferencias entre las partituras","body":"Uno de los aspectos más interesantes que recuerdo de la explicación fue la dificultad que suponía conseguir que la inteligencia artificial interpretara correctamente las partituras después de digitalizarlas.\n\nEl problema no consiste necesariamente en que el escáner cambie físicamente las notas de sitio, sino en que las imágenes pueden presentar deformaciones, inclinaciones, diferencias de calidad o estilos gráficos distintos.\n\nAdemás, existen partituras antiguas y manuscritas que pueden utilizar una notación o una presentación visual muy diferente de las partituras modernas.\n\nEstas variaciones pueden provocar que el sistema confunda símbolos, no detecte correctamente una nota o interprete de forma equivocada su posición en el pentagrama.","mode":"slides","transition":"up","autoplay":true,"interval":10},{"id":"xmwqav51abxf4","type":"text","title":"La adaptación al dominio y la inteligencia artificial","body":"La investigación de Adrián Roselló Pedraza está relacionada con las técnicas de adaptación al dominio (Domain Adaptation).\n\nEstas técnicas buscan que un modelo de inteligencia artificial pueda trabajar correctamente con datos que presentan características diferentes de los utilizados durante su entrenamiento.\n\nAplicado al reconocimiento de partituras, esto significa desarrollar sistemas que no dependan exclusivamente de un único estilo de escritura o formato musical, sino que puedan adaptarse a diferentes tipos de documentos.\n\nPara conseguirlo, se investigan métodos de aprendizaje automático y redes neuronales que permiten mejorar la capacidad de reconocimiento y adaptación del sistema.","mode":"slides","transition":"flip","autoplay":true,"interval":10},{"id":"xmwqavzp8pr8f","type":"text","title":"¿Qué utilidad puede tener esta tecnología?","body":"El reconocimiento automático de partituras tiene aplicaciones importantes en distintos ámbitos:\n\n-Conservación del patrimonio musical: permite digitalizar partituras antiguas y facilitar su conservación y consulta.\n\n-Educación musical: facilita el acceso a composiciones y materiales musicales.\n\n-Investigación: permite analizar grandes colecciones de partituras sin tener que transcribirlas manualmente una por una.\n\n-Accesibilidad: una partitura digitalizada puede transformarse en sonido, facilitando el acceso a la música a personas que no pueden leer directamente la notación visual.\n\n-Edición musical: permite convertir documentos impresos o manuscritos en formatos que pueden editarse mediante programas especializados.","mode":"slides","transition":"flip","autoplay":true,"interval":10},{"id":"xmwqax6ofcbqe","type":"text","title":"Conclusión","body":"Esta charla me pareció especialmente interesante porque mostró una aplicación de la inteligencia artificial que va más allá de los usos más conocidos, como los asistentes virtuales, los generadores de imágenes o los chatbots.\n\nMe llamó la atención que una tarea aparentemente sencilla, como reconocer las notas de una partitura, pueda convertirse en un problema tecnológico tan complejo. Una pequeña diferencia en la imagen puede provocar que el sistema interprete incorrectamente la información musical.\n\nTambién me permitió comprender que entrenar una inteligencia artificial no consiste únicamente en proporcionarle muchos ejemplos, sino que es necesario conseguir que pueda adaptarse a situaciones nuevas y a datos que no ha encontrado anteriormente.\n\nEn conclusión, la charla me ayudó a conocer una aplicación real de la inteligencia artificial en la investigación universitaria y a valorar cómo la informática puede contribuir a conservar, estudiar y recuperar obras musicales.","mode":"normal","transition":"slide","autoplay":false,"interval":6}],"iconAuto":true},{"id":"xmwqaxxwg6ngv","title":"Reflexiones finales","icon":"🏁","summary":"","parent":null,"transition":"up","blocks":[{"id":"xmwqaxxwgqoga","type":"text","title":"Reflexión sobre la situación actual en la ciberseguridad","body":"Actualmente, la ciberseguridad se ha convertido en algo imprescindible debido a que cada vez dependemos más de la tecnología. Utilizamos internet para estudiar, trabajar, comunicarnos, comprar e incluso realizar operaciones bancarias. Sin embargo, mientras avanzamos tecnológicamente, también aumentan los riesgos relacionados con el uso de Internet.\n\nSegún el Balance de Ciberseguridad 2025 del Instituto Nacional de Ciberseguridad (INCIBE), en España se gestionaron 122.223 incidentes de ciberseguridad durante 2025, un 26 % más que en 2024. Entre los problemas más frecuentes destacan el malware, el fraude online, el phishing y el robo de información. Estos datos demuestran que los ciberataques no son algo lejano que solamente afecta a grandes empresas, sino que también pueden perjudicar a cualquier persona.\n\nOtro aspecto que me parece especialmente preocupante es el avance de la inteligencia artificial. Aunque esta tecnología ofrece muchas ventajas, también puede utilizarse para crear mensajes fraudulentos más convincentes, suplantar identidades o facilitar determinados ataques informáticos. Esto hace que sea cada vez más difícil distinguir entre una comunicación legítima y una estafa.\n\nDespués de conocer esta información, considero que uno de los mayores problemas actuales no es únicamente la capacidad de los ciberdelincuentes, sino también la falta de conocimientos y precauciones de muchos usuarios. A veces utilizamos contraseñas poco seguras, abrimos enlaces sin comprobar su procedencia o compartimos información personal sin pensar en las consecuencias.\n\nEn mi opinión, la ciberseguridad debería considerarse una responsabilidad de todos. No basta con instalar un antivirus o tener un ordenador actualizado: también debemos aprender a identificar amenazas, proteger nuestros datos, utilizar contraseñas seguras y actuar con sentido común en Internet.\n\nComo estudiante del ámbito de la informática, esta situación me hace comprender que aprender sobre ciberseguridad no consiste solamente en adquirir conocimientos técnicos, sino también en desarrollar una mentalidad preventiva. La tecnología seguirá evolucionando y, con ella, aparecerán nuevas amenazas. \nPor eso, considero fundamental mantenernos informados y aprender continuamente para poder utilizar la tecnología de forma segura y responsable.\n\nFuente: https://www.incibe.es/","mode":"slides","transition":"flip","autoplay":true,"interval":15},{"id":"xmwqb28fzm09d","type":"images","title":"","layout":"mosaic","cols":3,"transition":"slide","autoplay":false,"interval":6,"items":[{"id":"xmwqb2s7jdiru","src":"media/asset_045.png","caption":""}]},{"id":"xmwqb2xat3172","type":"text","title":"Reflexión sobre gratitud, agradecimiento y perdón","body":"En ocasiones, podemos ser tan absorbidos por nuestros problemas, tareas y objetivos que nos olvidamos de hacer una parada para observar las cosas buenas que tenemos y debemos agradecer. El agradecimiento, la gratitud y el perdón son tres aspectos que yo consideraría fundamentales para el crecimiento personal y para las relaciones sanas con las personas que nos rodean. \n\nLa gratitud no sólo consiste en dar las gracias si alguien hace algo por nosotros. También consiste en aprender a saber detectar y a valorar lo que poseemos, las oportunidades que tenemos, las personas que nos acompañan y las experiencias que nos van ayudando a crecer. No necesariamente debemos tener una vida perfecta para encontrar cosas para estar agradecidos.\n\nEn el artículo \"Perdón y gratitud, predictores\" se analizan la relación entre estos dos valores y el bienestar psicológico. La investigación que se produce muestra que la gratitud y el perdón pueden estar relacionados con un bienestar mayor y que practicar la gratitud puede llegar a reducir el estrés.\n\nPor otra parte, me parece que el perdón constituye uno de los aspectos más complicados de llevar a cabo. Cuando una persona nos hace daño, parece bastante normal experimentar tristeza, decepción o incluso ira, pero mantener en todo momento esos mismos sentimientos, si bien es natural, a uno le puede terminar haciendo más daño de lo que se cree. \nEntender el perdón no es justificar lo que otra persona ha hecho, no es olvidar, no es permitir que una persona que nos haya hecho daño que lo siga haciendo. \n\nEn mi opinión es aprender a dejar de vivir atados a los resentimientos. También implica entender que todos los seres humanos nos erramos, y, eventualmente, nosotros mismos podemos llegar a necesitar ser perdonados por las personas que nos rodean.\n\nEntiendo que estos tres valores están interrelacionados. La gratitud nos hace conscientes de lo que tenemos; el agradecimiento nos permite ver y reconocer lo que otras personas hacen por nosotros, expresándolo; el perdón nos ayuda a sobrellevar los conflictos sin permitir que el rencor imperie en nuestras vidas. \n\nEn este sentido, esta reflexión me lleva a pensar que no debemos esperar a perder algo o a alguien para ser conscientes de su importancia. Muchas veces damos por supuesto que las personas que nos quieren estarán siempre ahí; que habrá nuevas oportunidades, que ahora podemos corregir nuestros errores.\n\nDel mismo modo pienso que es bueno que aprendamos a disculparnos cuando cometemos un error. Asumir los fallos no significa que uno sea más incompetente, sino que se pone en evidencia la madurez y la disposición mejorable de la persona.\n\nPara resumir, pienso que una vida con mayor calidad no tiene que ver sólo con alcanzar los propósitos o el éxito, sino que también tiene relación con cómo nos hemos comportado con los otros y con cómo se pueden vivir las experiencias por uno mismo. Aprender el agradecimiento, hacer un gesto de agradecimiento y aprender a pedir perdón son pequeñas acciones que pueden tener un gran impacto en cómo vivimos y cómo nos relacionamos con los demás.\n\nFuente: https://dialnet.unirioja.es/servlet/articulo?codigo=8378169\n","mode":"slides","transition":"flip","autoplay":true,"interval":15},{"id":"xmwqbgl07p41i","type":"images","title":"","layout":"mosaic","cols":3,"transition":"slide","autoplay":false,"interval":6,"items":[{"id":"xmwqbh5saqggw","src":"media/asset_046.jpg","caption":""}]}],"iconAuto":true}],"playlist":[{"id":"xmwqirz49o115","name":"1","data":"media/asset_047.mp3"},{"id":"xmwqirz4jlyza","name":"2","data":"media/asset_048.mp3"},{"id":"xmwqirz4scx2f","name":"3","data":"media/asset_049.mp3"},{"id":"xmwqirz4z8lmb","name":"4","data":"media/asset_050.mp3"},{"id":"xmwqirz5bacqo","name":"5","data":"media/asset_051.mp3"},{"id":"xmwqirz5k9gpq","name":"6","data":"media/asset_052.mp3"},{"id":"xmwqirz5r8nav","name":"7","data":"media/asset_053.mp3"},{"id":"xmwqirz5xqoix","name":"8","data":"media/asset_054.mp3"},{"id":"xmwqirz6356vy","name":"9","data":"media/asset_055.mp3"},{"id":"xmwqirz68bn8t","name":"10","data":"media/asset_056.mp3"},{"id":"xmwqirz6ea4v6","name":"11","data":"media/asset_057.mp3"},{"id":"xmwqirz6leo9c","name":"12","data":"media/asset_058.mp3"},{"id":"xmwqirz70pxak","name":"13","data":"media/asset_059.mp3"},{"id":"xmwqirz76w4y8","name":"14","data":"media/asset_060.mp3"},{"id":"xmwqirz7b8bda","name":"15","data":"media/asset_061.mp3"},{"id":"xmwqirz7irc9u","name":"16","data":"media/asset_062.mp3"},{"id":"xmwqisfldl56e","name":"17","data":"media/asset_063.mp3"},{"id":"xmwqisfljgs0h","name":"18","data":"media/asset_064.mp3"}]}</script>

f"], "fly": ["media/asset_133.gif", "media/asset_134.gif"], "sleep": ["media/asset_135.gif", "media/asset_136.gif"], "drag": ["media/asset_137.gif", "media/asset_138.gif"], "act": ["media/asset_139.gif", "media/asset_140.gif"], "act2": ["media/asset_141.gif", "media/asset_142.gif"]}, "spike": {"stand": ["media/asset_143.gif", "media/asset_144.gif"], "walk": ["media/asset_145.gif", "media/asset_146.gif"], "run": ["media/asset_147.gif", "media/asset_148.gif"], "act": ["media/asset_149.gif", "media/asset_150.gif"], "act2": ["media/asset_151.gif", "media/asset_152.gif"]}};   // { personaje: { estado: [GIF derecha, GIF izquierda] } }

  function toast(msg) { const t = $('toast'); t.innerText = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 2800); }

  // Frases de cada pony (sobre la serie My Little Pony: La Magia de la Amistad). Se reparten en orden aleatorio sin repetirse.
  const QUOTES = {
    twilight: [
      "Cuando llegué a Ponyville, la Princesa Celestia solo me pidió que estudiara la magia de la amistad. ¡Y mira cuántas amigas hice!",
      "Spike, ¿ya enviaste mi informe de amistad a la Princesa Celestia? ¡Hay que mandarlo cada semana!",

      if (d[d.length - 1] === lastQuote[k]) [d[0], d[d.length - 1]] = [d[d.length - 1], d[0]];
      quoteDecks[k] = d;
    }
    return (lastQuote[k] = quoteDecks[k].pop());
  }

  const petBox = $('shimeji-container'), petImg = $('shimeji-img');
  const SPEED = { walk: 2.2, run: 6, fly: 3 };
  const pet = { x: 300, foot: 0, dir: 1, state: 'stand', until: 0, target: null, falling: false, vy: 0,
                dragging: false, w: 90, h: 90, key: '' };

  const FALLBACK = { drag: ['fly', 'stand'], sleep: ['stand'], fly: ['walk', 'stand'], run: ['walk', 'stand'],
                     walk: ['stand'], act: ['stand'], act2: ['act', 'stand'] };
  function resolveState(s) {
    const set = SPRITES[currentPony];
    if (set[s]) return s;
    for (const f of (FALLBACK[s] || ['stand'])) if (set[f]) return f;
    return 'stand';
  }
  const has = s => !!SPRITES[currentPony][s];

  function setState(s) { pet.state = resolveState(s); }

  function render() {
    const st = resolveState(pet.state);
    const file = SPRITES[currentPony][st][pet.dir > 0 ? 0 : 1];
    const key = currentPony + st + pet.dir;
    if (key !== pet.key) { pet.key = key; petImg.src = spriteUrl(file); }
    petBox.style.width = pet.w + 'px';
    petBox.style.left = Math.round(pet.x - pet.w / 2) + 'px';
    petBox.style.top = Math.round(pet.foot - pet.h) + 'px';
    petBox.classList.toggle('below', pet.foot - pet.h < 150);
  }
  petImg.addEventListener('load', () => {
    pet.w = petImg.naturalWidth * SCALE; pet.h = petImg.naturalHeight * SCALE;
    petImg.style.width = pet.w + 'px'; petImg.style.height = pet.h + 'px';
    render();
  });

  function go(x, foot, state, speed) {           // mueve la mascota a un punto; devuelve una promesa
    return new Promise(res => {
      pet.falling = false; setState(state);
      pet.target = { x, foot, speed: speed || SPEED[state] || 3, res };
    });
  }
  function play(state, ms) { pet.target = null; pet.falling = false; setState(state); return sleepMs(ms); }

  function pickWeighted(opts) {
    let r = Math.random() * opts.reduce((a, o) => a + o[1], 0);
    for (const o of opts) { if ((r -= o[1]) <= 0) return o[0]; }
    return opts[0][0];
  }

  function chooseNext() {
    const now = Date.now();
    if (pet.foot < floorY() - 8) {                // estaba en el aire: aterriza
      go(pet.x, floorY(), 'fly', SPEED.fly).then(() => { setState('stand'); pet.until = Date.now() + rand(1500, 3500); });
      return;
    }
    const opts = [['stand', 3], ['walk', 4]];
    if (has('run')) opts.push(['run', 1]);
    if (has('sleep')) opts.push(['sleep', 1.2]);
    if (has('fly')) opts.push(['fly', 2]);
    const s = pickWeighted(opts);
    pet.dir = Math.random() < .5 ? -1 : 1;
    if (s === 'fly') {
      go(rand(80, innerWidth - 80), rand(innerHeight * .3, innerHeight * .65), 'fly', SPEED.fly)
        .then(() => { pet.until = Date.now() + rand(2000, 4500); });
      pet.until = now + 60000;
    } else {
      setState(s);
      pet.until = now + (s === 'sleep' ? rand(8000, 14000) : s === 'stand' ? rand(2500, 5500) : rand(3000, 7000));
    }
  }

  function tick() {
    if (isAdminMode) return;
    if (pet.dragging) { render(); return; }
    if (pet.falling) {
      pet.vy += 1.1; pet.foot += pet.vy;
      if (pet.foot >= floorY()) { pet.foot = floorY(); pet.falling = false; pet.vy = 0; setState('stand'); pet.until = Date.now() + 1800; }
    } else if (pet.target) {
      const t = pet.target, dx = t.x - pet.x, dy = t.foot - pet.foot, dist = Math.hypot(dx, dy);
      if (Math.abs(dx) > 1) pet.dir = dx > 0 ? 1 : -1;
      if (dist <= t.speed) { pet.x = t.x; pet.foot = t.foot; pet.target = null; t.res && t.res(); }
      else { pet.x += dx / dist * t.speed; pet.foot += dy / dist * t.speed; }
    } else if (!isSabotaged) {
      if (commentPending) { if (pet.state !== 'stand') setState('stand'); }   // quieta mientras habla
      else {
        if (Date.now() > pet.until) chooseNext();
        if (pet.state === 'walk' || pet.state === 'run') {
          pet.x += pet.dir * (SPEED[pet.state] || 2);
          const m = pet.w / 2 + 4;
          if (pet.x < m) { pet.x = m; pet.dir = 1; } else if (pet.x > innerWidth - m) { pet.x = innerWidth - m; pet.dir = -1; }
        }
      }
      pet.foot = Math.min(pet.foot, floorY());
    }
    render();
  }

  // Constructor de elementos HTML
  function h(tag, props, ...kids) {
    const e = document.createElement(tag);
    if (props) for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;

  function chooseQuiz() {
    const bank = QUIZZES[currentPony] || QUIZZES.twilight;
    const key = currentPony;
    if (!Array.isArray(quizSeen[key])) quizSeen[key] = [];
    let available = bank.map((q,i)=>i).filter(i=>!quizSeen[key].includes(i));
    // No se repite ninguna pregunta hasta agotar todas las de esa pony.
    if (!available.length) { quizSeen[key] = []; available = bank.map((q,i)=>i); }
    const idx = available[Math.floor(Math.random()*available.length)];
    quizSeen[key].push(idx); lsSet('equestriaQuizSeenV2', quizSeen);
    const q = loreForNextQuestion || bank[idx];
    if (loreForNextQuestion) loreForNextQuestion = null;
    return {q, options:q[1].map((v,i)=>({v,i})).sort(()=>Math.random()-.5)};
  }
  function triggerPonyComment() {
    commentPending = true; clearTimeout(pokeTimeout);
    const bubble = $('speech-bubble'); quizCurrent = chooseQuiz();
    bubble.innerHTML = `<div>${esc(quizCurrent.q[0])}</div><div class="quiz-options">${quizCurrent.options.map(o=>`<button type="button" onclick="answerPonyQuiz(${o.i},event)">${esc(o.v)}</button>`).join('')}</div>`;
    bubble.style.display = 'block';
    ignoreTimeout = setTimeout(() => { if (commentPending) { commentPending=false; bubble.style.display='none'; executePonySabotage(); } }, 45000);
  }
  function answerPonyQuiz(choice, ev) {
    if (ev) ev.stopPropagation(); if (!commentPending || !quizCurrent) return;
    clearTimeout(ignoreTimeout); clearTimeout(ignoreTimeout2); commentPending = false;
    const ok = choice === quizCurrent.q[2];

      setTimeout(()=>{ if(!isSabotaged) { bubble.style.display='none'; executePonySabotage(); } },2200);

    $('sabotage-overlay').appendChild(d);
